  /webhook/notifications:
    get:
      tags: [Webhooks - Management]
      summary: List one page of movie, series and anime notifications, newest first
      description: >-
        Ordering, paging and counting run across both notification tables in one
        query, so a page is the newest records overall and `total` is the real
        number of matches.
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/MediaTypeFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Limit50'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedNotificationList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /webhook/notifications/bulk-delete:
    post:
      tags: [Webhooks - Management]
      summary: Delete several notifications, by id or by re-running a filter
      description: >-
        Notification ids are unique across both tables, so a delete by id finds
        the owning table without the caller tracking the source. With
        `all_matching` the filter is re-evaluated here and `ids` is ignored.
        Media already copied and the transfers that copied it are not touched.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                all_matching:
                  type: boolean
                status:
                  type: string
                media_type:
                  type: string
                search:
                  type: string
      responses:
        '200':
          description: How many notifications were deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  deleted_count:
                    type: integer
                  message:
                    type: string
        '400':
          description: '`ids` was present but not a list'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Deletion failed

  /webhook/series/notifications:
    get:
      tags: [Webhooks - Management]
      summary: List TV series notifications only
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
