openapi: 3.0.3
info:
  title: DragonCP API
  description: |
    Machine-readable index of the DragonCP backend HTTP API.

    **`api.md` in this directory is authoritative.** This file exists so the API
    can be imported into an API client or used to generate a stub client. It
    lists every endpoint with its method, path, auth requirement and a one-line
    summary; request and response schemas are deliberately thin and name only
    the common fields. Where the two differ, `api.md` is correct and this file
    needs fixing.

    Written by reading the `@app.route` / `@*_bp.route` decorators in `app.py`
    and `routes/`. Every blueprint is registered under the `/api` prefix, which
    is part of the server URL below, so paths here are written without it.

    `GET /` is not listed: it renders the legacy HTML page and is not an API
    route.

    Endpoint count: 83 method+path operations.

    ## Authentication

    Most endpoints require a JWT access token issued by `POST /auth/login`:

    ```
    Authorization: Bearer <access-token>
    ```

    Query-string tokens (`?token=...`) are not accepted on normal HTTP requests.

    The three webhook receivers do not take a JWT. They are guarded by
    `require_webhook_auth`, which enforces an HMAC `X-DragonCP-Signature` header
    when `WEBHOOK_SECRET` is set and a source-IP allowlist when
    `WEBHOOK_ALLOWED_IPS` is set. When both are set, either check passing is
    enough. When neither is set the receivers are open and the server logs a
    warning.
  version: "2.0.0"
  contact:
    name: DragonCP

servers:
  - url: http://localhost:5000/api
    description: Local development server

tags:
  - name: Authentication
    description: Login, logout, token verification and refresh
  - name: Configuration
    description: Runtime configuration and SSH connection management
  - name: Media Browsing
    description: Browse remote media folders and compare them with local copies
  - name: Transfers
    description: Start, monitor, pause, resume and manage rsync transfers
  - name: Webhooks - Receivers
    description: Radarr/Sonarr receivers; webhook auth, not JWT
  - name: Webhooks - Management
    description: List, inspect, sync, complete and delete webhook notifications
  - name: Webhooks - Renames
    description: Rename-event history and on-demand verification
  - name: Webhooks - Settings
    description: Auto-sync and Discord notification settings
  - name: Backups
    description: Pre-sync backup listing, restore and reindex
  - name: Debug
    description: Diagnostics, runtime status and disk usage
  - name: Logs
    description: Backend log reading and download
  - name: Simulation
    description: Run the real transfer pipeline against throwaway files

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from POST /auth/login.
    webhookSignature:
      type: apiKey
      in: header
      name: X-DragonCP-Signature
      description: |
        HMAC-SHA256 of the raw request body, formatted `sha256=<hex digest>`,
        keyed with WEBHOOK_SECRET. Enforced only when WEBHOOK_SECRET is set. A
        request from an address in WEBHOOK_ALLOWED_IPS is accepted without it.

  parameters:
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
    TransferId:
      name: transfer_id
      in: path
      required: true
      schema:
        type: string
    BackupId:
      name: backup_id
      in: path
      required: true
      schema:
        type: string
    MediaType:
      name: media_type
      in: path
      required: true
      schema:
        type: string
        enum: [movies, tvshows, anime]
    FolderName:
      name: folder_name
      in: path
      required: true
      schema:
        type: string
    SeasonName:
      name: season_name
      in: path
      required: true
      schema:
        type: string
    StatusFilter:
      name: status
      in: query
      required: false
      description: Exact status match; omit for all.
      schema:
        type: string
    Limit50:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50

  schemas:
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
      required: [status]

    ConfigObject:
      type: object
      description: |
        Raw configuration key/value object, not wrapped in a status envelope.
        Secrets are stripped before the response is sent.
      additionalProperties: true

    NotificationList:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        notifications:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer

    TransferList:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        transfers:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer

    QueueStatus:
      type: object
      description: |
        Queue counters. `active_destinations` carries the transfer IDs that own
        reserved destinations, not the path strings.
      properties:
        max_concurrent:
          type: integer
        running_count:
          type: integer
        queued_count:
          type: integer
        available_slots:
          type: integer
        running_transfer_ids:
          type: array
          items:
            type: string
        queued_transfer_ids:
          type: array
          items:
            type: string
        active_destinations:
          type: array
          items:
            type: string

    DryRunResult:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        dry_run_result:
          type: object
          description: Simulated rsync outcome; api.md lists the fields.
          additionalProperties: true

    VerificationResult:
      type: object
      description: |
        Rename verification outcome. `result.status` is `verified`, `partial` or
        `failed`; the HTTP code reports whether the check ran, not whether it
        passed.
      properties:
        status:
          type: string
          enum: [success, error]
        result:
          type: object
          properties:
            notification_id:
              type: string
            series_title:
              type: string
            media_type:
              type: string
            status:
              type: string
              enum: [verified, partial, failed]
            total_files:
              type: integer
            verified_count:
              type: integer
            failed_count:
              type: integer
            verified_at:
              type: string
            message:
              type: string
            files:
              type: array
              items:
                type: object
                additionalProperties: true

  responses:
    Success:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:

  # ==================== AUTHENTICATION ====================

  /auth/login:
    post:
      tags: [Authentication]
      summary: Exchange username and password for an access token and a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required: [username, password]
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  token:
                    type: string
                  refresh_token:
                    type: string
                  expires_at:
                    type: string
                  refresh_expires_at:
                    type: string
                  user:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Backend authentication is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out the current user (client-side logout for a stateless JWT flow)
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/verify:
    get:
      tags: [Authentication]
      summary: Report whether the supplied access token is still valid
      security: []
      responses:
        '200':
          description: Always success; read `valid` for the answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  valid:
                    type: boolean
                  user:
                    type: string
                  remaining_seconds:
                    type: integer
                  message:
                    type: string

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange a valid refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required: [refresh_token]
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  token:
                    type: string
                  expires_at:
                    type: string
                  user:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/status:
    get:
      tags: [Authentication]
      summary: Report whether authentication is configured on this server
      security: []
      responses:
        '200':
          description: Auth configuration state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  auth_configured:
                    type: boolean
                  message:
                    type: string

  # ==================== CONFIGURATION AND SSH ====================

  /config:
    get:
      tags: [Configuration]
      summary: Return the active runtime configuration (environment plus session overrides)
      responses:
        '200':
          description: Configuration object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Configuration]
      summary: Apply session-level configuration overrides
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigObject'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /config/reset:
    post:
      tags: [Configuration]
      summary: Drop session overrides and fall back to environment values
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /config/env-only:
    get:
      tags: [Configuration]
      summary: Return environment configuration only, ignoring session overrides
      responses:
        '200':
          description: Configuration object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigObject'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /connect:
    post:
      tags: [Configuration]
      summary: Open an SSH connection to the remote server and attach it to the runtime
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                username:
                  type: string
                password:
                  type: string
                key_path:
                  type: string
      responses:
        '200':
          description: |
            Connection attempted. A missing field or a failed connection is
            reported in the body as `status: error`, still with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Body was valid JSON but not an object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /disconnect:
    post:
      tags: [Configuration]
      summary: Close the current SSH connection and clear connection state
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auto-connect:
    get:
      tags: [Configuration]
      summary: Connect over SSH using the configured environment credentials
      responses:
        '200':
          description: |
            Connection attempted. Missing credentials or a failed connection are
            reported in the body as `status: error`, still with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ssh-config:
    get:
      tags: [Configuration]
      summary: Return the loaded SSH settings, with the password reduced to a boolean
      responses:
        '200':
          description: SSH settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  host:
                    type: string
                  username:
                    type: string
                  key_path:
                    type: string
                  has_password:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== MEDIA BROWSING ====================

  /media-types:
    get:
      tags: [Media Browsing]
      summary: List the three media types and their configured source paths
      responses:
        '200':
          description: Media type list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    path:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /folders/{media_type}:
    get:
      tags: [Media Browsing]
      summary: List remote folders for one media type
      parameters:
        - $ref: '#/components/parameters/MediaType'
      responses:
        '200':
          description: Folder list with modification times
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  folders:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /seasons/{media_type}/{folder_name}:
    get:
      tags: [Media Browsing]
      summary: List season folders inside one series or anime folder
      parameters:
        - $ref: '#/components/parameters/MediaType'
        - $ref: '#/components/parameters/FolderName'
      responses:
        '200':
          description: Season list with modification times
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  seasons:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /episodes/{media_type}/{folder_name}/{season_name}:
    get:
      tags: [Media Browsing]
      summary: List the files inside one season folder
      parameters:
        - $ref: '#/components/parameters/MediaType'
        - $ref: '#/components/parameters/FolderName'
        - $ref: '#/components/parameters/SeasonName'
      responses:
        '200':
          description: Episode file names
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  episodes:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sync-status/{media_type}:
    get:
      tags: [Media Browsing]
      summary: Compare every folder of one media type against its local copy
      parameters:
        - $ref: '#/components/parameters/MediaType'
      responses:
        '200':
          description: Per-folder sync status keyed by folder name
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  sync_statuses:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sync-status/{media_type}/{folder_name}:
    get:
      tags: [Media Browsing]
      summary: Return the sync status of one folder, with season detail for series and anime
      parameters:
        - $ref: '#/components/parameters/MediaType'
        - $ref: '#/components/parameters/FolderName'
      responses:
        '200':
          description: Folder sync status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  folder_name:
                    type: string
                  sync_status:
                    type: object
                    additionalProperties: true
                  seasons_sync_status:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sync-status/{media_type}/{folder_name}/enhanced:
    get:
      tags: [Media Browsing]
      summary: Return folder sync status with file counts, sizes and sample file metadata
      parameters:
        - $ref: '#/components/parameters/MediaType'
        - $ref: '#/components/parameters/FolderName'
      responses:
        '200':
          description: Enhanced folder sync status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  folder_name:
                    type: string
                  sync_status:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /media/dry-run:
    post:
      tags: [Media Browsing]
      summary: Preview an rsync for a chosen media folder without changing any file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                media_type:
                  type: string
                  enum: [movies, tvshows, anime]
                folder_name:
                  type: string
                season_name:
                  type: string
                  description: Optional; series and anime only.
              required: [media_type, folder_name]
      responses:
        '200':
          description: Dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== TRANSFERS ====================

  /transfer:
    post:
      tags: [Transfers]
      summary: Start a transfer, or queue it when a slot or the destination path is busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [folder, file]
                media_type:
                  type: string
                  enum: [movies, tvshows, anime]
                folder_name:
                  type: string
                season_name:
                  type: string
                episode_name:
                  type: string
                  description: Required when type is `file`.
              required: [media_type, folder_name]
      responses:
        '200':
          description: Transfer admitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  transfer_id:
                    type: string
                  transfer_state:
                    type: string
                  message:
                    type: string
                  source:
                    type: string
                  destination:
                    type: string
                  episode_name:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfer/{transfer_id}/status:
    get:
      tags: [Transfers]
      summary: Return one transfer with its progress and log summary
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Transfer object
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  transfer:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfer/{transfer_id}/logs:
    get:
      tags: [Transfers]
      summary: Return the full stored log lines for one transfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Log lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  logs:
                    type: array
                    items:
                      type: string
                  log_count:
                    type: integer
                  transfer_status:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfer/{transfer_id}/cancel:
    post:
      tags: [Transfers]
      summary: Cancel a transfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: |
            Cancellation attempted. A failure is reported in the body as
            `status: error`, still with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfer/{transfer_id}/pause:
    post:
      tags: [Transfers]
      summary: Stop a running transfer but keep its partial files and free its queue slot
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          description: Only a running transfer can be paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /transfer/{transfer_id}/resume:
    post:
      tags: [Transfers]
      summary: Resume a paused transfer from its partial files, re-queueing it if no slot is free
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: |
            Resumed, or queued because no slot was free - the message says
            which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Not paused, or another transfer now owns the destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /transfer/{transfer_id}/restart:
    post:
      tags: [Transfers]
      summary: Restart a failed or cancelled transfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfer/{transfer_id}/delete:
    post:
      tags: [Transfers]
      summary: Delete a transfer record; a running transfer must be cancelled first
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: |
            Deletion attempted. A refusal, such as a still-running transfer, is
            reported in the body as `status: error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfers/all:
    get:
      tags: [Transfers]
      summary: List historical transfers, filtered in SQL by status before the limit is applied
      parameters:
        - $ref: '#/components/parameters/Limit50'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: Transfer list; carries `log_count` but never the log bodies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfers/active:
    get:
      tags: [Transfers]
      summary: List currently active transfers together with queue state
      responses:
        '200':
          description: Active transfers and queue counters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TransferList'
                  - type: object
                    properties:
                      queue_status:
                        $ref: '#/components/schemas/QueueStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfers/queue/status:
    get:
      tags: [Transfers]
      summary: Return queue counters only
      responses:
        '200':
          description: Queue counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  queue:
                    $ref: '#/components/schemas/QueueStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfers/cleanup:
    post:
      tags: [Transfers]
      summary: Remove duplicate transfer records per destination, keeping the latest successful one
      responses:
