      summary: List the files in a local directory
      parameters:
        - name: path
          in: query
          required: false
          schema:
            type: string
            default: "/"
      responses:
        '200':
          description: File names
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  files:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /disk-usage/local:
    get:
      tags: [Debug]
      summary: Return disk usage for the configured local paths
      responses:
        '200':
          description: Per-path usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  disk_info:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /disk-usage/remote:
    get:
      tags: [Debug]
      summary: Call the configured remote disk API and normalise its storage figures
      responses:
        '200':
          description: Remote storage figures
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  storage_info:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== SERVER LOGS ====================

  /logs:
    get:
      tags: [Logs]
      summary: Return recent backend log records matching the requested severity
      description: >-
        Matching is not uniformly "level and above". ALL returns everything,
        ERROR returns ERROR and CRITICAL, WARNING returns WARNING, ERROR and
        CRITICAL, and DEBUG, INFO and CRITICAL match that level exactly. An
        unrecognised value is coerced to ERROR.
      parameters:
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL, ALL]
            default: ERROR
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            maximum: 1000
        - name: search
          in: query
          required: false
          description: Case-insensitive substring match.
          schema:
            type: string
      responses:
        '200':
          description: Log records
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  log_file:
                    type: string
                  level:
                    type: string
                  limit:
                    type: integer
                  line_count:
                    type: integer
                  size_bytes:
                    type: integer
                  last_modified:
                    type: string
                    format: date-time
                  lines:
                    type: array
                    description: Oldest first.
                    items:
                      type: object
                      properties:
                        level:
                          type: string
                        text:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /logs/download:
    get:
      tags: [Logs]
      summary: Download the whole backend log file as an attachment
      responses:
        '200':
          description: The live log file as an attachment. Rotated files are not served.
          content:
            text/plain:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Log file is not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== SIMULATION ====================

  /simulation/status:
    get:
      tags: [Simulation]
      summary: List the available scenarios and what is currently on the board
      responses:
        '200':
          description: Scenarios and current simulation state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  scenarios:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: integer
                  by_status:
                    type: object
                    additionalProperties: true
                  finished:
                    type: boolean
                  disk_bytes:
                    type: integer
                  real_transfers_running:
                    type: integer
                  max_concurrent:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /simulation/start:
    post:
      tags: [Simulation]
      summary: Generate fixture files and run a scenario through the real transfer pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario:
                  type: string
                  enum: [queue_overflow, path_conflict, slow_copy, failure, season_batch]
                confirm_busy:
                  type: boolean
                  description: Required to proceed when real transfers are running.
              required: [scenario]
      responses:
        '200':
          description: Simulation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  run_id:
                    type: string
                  transfer_ids:
                    type: array
                    items:
                      type: string
        '400':
          description: Unknown scenario, a simulation already on the board, a scenario above the size ceiling, or too little free disk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Real transfers are running and confirm_busy was not set
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  code:
                    type: string
                    enum: [real_transfers_running]
                  message:
                    type: string
                  running:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /simulation/stop:
    post:
      tags: [Simulation]
      summary: Cancel simulated transfers that are still moving, leaving their rows in place
      responses:
        '200':
          description: Stop summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  stopped:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /simulation/cleanup:
    post:
      tags: [Simulation]
      summary: Remove every simulation row and the files the simulation generated
      responses:
        '200':
          description: Cleanup summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  transfers_removed:
                    type: integer
                  notifications_removed:
                    type: integer
                  files_removed:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
