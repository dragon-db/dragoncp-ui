                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid X-DragonCP-Signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Source IP not in WEBHOOK_ALLOWED_IPS
