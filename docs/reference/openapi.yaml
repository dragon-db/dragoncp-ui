openapi: 3.0.3
info:
  title: DragonCP API
  description: |
    Machine-readable index of the DragonCP backend HTTP API.

    **`api.md` in this directory is authoritative.** This file exists so the API
    can be imported into an API client or used to generate a stub client. It
    lists every endpoint with its method, path, auth requirement and a one-line
    summary; request and response schemas are deliberately thin and name only
    the common fields. Where the two differ, `api.md` is correct and this file
    needs fixing.

    Written by reading the `@app.route` / `@*_bp.route` decorators in `app.py`
    and `routes/`. Every blueprint is registered under the `/api` prefix, which
    is part of the server URL below, so paths here are written without it.

    `GET /` is not listed: it serves the React application shell and is not an
    API route.

    Endpoint count: 100 method+path operations.

    ## Authentication

    Most endpoints require a JWT access token issued by `POST /auth/login`:

    ```
    Authorization: Bearer <access-token>
    ```

    Query-string tokens (`?token=...`) are not accepted on normal HTTP requests.

    The three webhook receivers do not take a JWT. They are guarded by
    `require_webhook_auth`, which enforces an HMAC `X-DragonCP-Signature` header
    when `WEBHOOK_SECRET` is set and a source-IP allowlist when
    `WEBHOOK_ALLOWED_IPS` is set. When both are set, either check passing is
    enough. When neither is set the receivers are open and the server logs a
    warning.
  version: "2.0.0"
  contact:
    name: DragonCP

servers:
  - url: http://localhost:5000/api
    description: Local development server

tags:
  - name: Authentication
    description: Login, logout, token verification and refresh
  - name: Configuration
    description: Runtime configuration and SSH connection management
  - name: Media Browsing
    description: Browse remote media folders and compare them with local copies
  - name: Transfers
    description: Start, monitor, pause, resume and manage rsync transfers
  - name: Webhooks - Receivers
    description: Radarr/Sonarr receivers; webhook auth, not JWT
  - name: Webhooks - Management
    description: List, inspect, sync, complete and delete webhook notifications
  - name: Webhooks - Renames
    description: Rename-event history and on-demand verification
  - name: Webhooks - Settings
    description: Auto-sync and Discord notification settings
  - name: Backups
    description: Pre-sync backup listing, restore and reindex
  - name: Debug
    description: Diagnostics, runtime status and disk usage
  - name: Logs
    description: Backend log reading and download
  - name: Simulation
    description: Run the real transfer pipeline against throwaway files
  - name: Explore
    description: Compare the remote library with the local one and plan a sync

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from POST /auth/login.
    webhookSignature:
      type: apiKey
      in: header
      name: X-DragonCP-Signature
      description: |
        HMAC-SHA256 of the raw request body, formatted `sha256=<hex digest>`,
        keyed with WEBHOOK_SECRET. Enforced only when WEBHOOK_SECRET is set. A
        request from an address in WEBHOOK_ALLOWED_IPS is accepted without it.

  parameters:
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
    TransferId:
      name: transfer_id
      in: path
      required: true
      schema:
        type: string
    BackupId:
      name: backup_id
      in: path
      required: true
      schema:
        type: string
    MediaType:
      name: media_type
      in: path
      required: true
      schema:
        type: string
        enum: [movies, tvshows, anime]
    FolderName:
      name: folder_name
      in: path
      required: true
      schema:
        type: string
    SeasonName:
      name: season_name
      in: path
      required: true
      schema:
        type: string
    StatusFilter:
      name: status
      in: query
      required: false
      description: Exact status match; omit for all.
      schema:
        type: string
    Limit50:
      name: limit
      in: query
      required: false
      description: Page size. Values above 200 are clamped to 200.
      schema:
        type: integer
        default: 50
        maximum: 200
    Offset:
      name: offset
      in: query
      required: false
      description: Where the page starts, counted in records.
      schema:
        type: integer
        default: 0
    Search:
      name: search
      in: query
      required: false
      description: >-
        Free-text match, applied anywhere in the searched columns. Transfers
        search title, folder, season, source and destination paths and the
        transfer id; notifications search title, paths, release title,
        requester and notification id.
      schema:
        type: string
    StatusesFilter:
      name: statuses
      in: query
      required: false
      description: >-
        Comma-separated statuses to include, e.g. `completed,failed,cancelled`.
        Used where a list covers a set of statuses rather than one.
      schema:
        type: string
    MediaTypeFilter:
      name: media_type
      in: query
      required: false
      description: >-
        `movies`/`movie` selects movie notifications; anything else selects
        series notifications, with `tvshows` also matching the legacy `series`
        value.
      schema:
        type: string

  schemas:
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
      required: [status]

    ConfigObject:
      type: object
      description: |
        Settings, in two shapes at once.

        `groups` is the data shaped for the React Settings screen, with the
        store and editability of each setting attached. Top-level flat keys are
        a deprecated compatibility shape retained through the cutover soak.

        Environment secrets are omitted entirely rather than redacted — there is
        nothing a reader could do with a redacted value they cannot change.
        Editable secrets come back as the literal string `<redacted>`, and
        sending that back means "unchanged".
      additionalProperties: true
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              settings:
                type: array
                items:
                  $ref: '#/components/schemas/SettingDescription'
        stores:
          type: object
          description: A label and an explanation for each store, for the UI to show.
          additionalProperties: true

    SettingDescription:
      type: object
      properties:
        key: { type: string }
        store:
          type: string
          enum: [env, db]
          description: >-
            `env` comes from dragoncp_env.env and is read-only at runtime.
            `db` is stored in app_settings and takes effect immediately.
        group: { type: string }
        label: { type: string }
        description: { type: string }
        kind:
          type: string
          enum: [text, password, number, boolean, path]
        editable:
          type: boolean
          description: True only for `db` settings. A write to any other key is refused by name.
        sensitive: { type: boolean }
        value: {}
        minimum: { type: integer }
        maximum: { type: integer }
        is_default:
          type: boolean
          description: >-
            `db` settings only. True when no row exists — a row holding an empty
            string is a deliberate choice, not an absence.

    ConfigSaveResult:
      type: object
      description: The full GET payload, plus what the write actually did.
      additionalProperties: true
      properties:
        status: { type: string }
        message: { type: string }
        saved:
          type: array
          items: { type: string }
          description: Keys that were written.
        refused:
          type: array
          items: { type: string }
          description: >-
            Keys that come from the environment file, or are not settings at all.
            Reported by name so a client can say what did not change.

    NotificationList:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        notifications:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
          description: >-
            The number of records returned. Only the paged listings report a
            figure independent of the page - see PagedNotificationList.

    PagedNotificationList:
      description: >-
        One page of the combined notification list. Rows carry `media_type`
        (`movie` for movie rows, the stored value for series rows) and
        `display_title`, so a caller need not know which table a row came from.
      allOf:
        - $ref: '#/components/schemas/NotificationList'
        - type: object
          properties:
            total:
              type: integer
              description: Records matching the filter across the whole table.
            count:
              type: integer
              description: Records on this page.
            limit:
              type: integer
            offset:
              type: integer
            status_counts:
              type: object
              additionalProperties:
                type: integer
              description: >-
                Matching records per status. Honours the search and set filters and
                ignores the single-status filter, so counts stay stable as filters
                change.
            unfiltered_total:
              type: integer
              description: Records ignoring the status filter and search.

    TransferList:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        transfers:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
          description: >-
            The number of records returned. Only the paged listings report a
            figure independent of the page - see PagedTransferList.

    PagedTransferList:
      description: One page of the transfer history.
      allOf:
        - $ref: '#/components/schemas/TransferList'
        - type: object
          properties:
            total:
              type: integer
              description: Records matching the filter across the whole table.
            count:
              type: integer
              description: Records on this page.
            limit:
              type: integer
            offset:
              type: integer
            status_counts:
              type: object
              additionalProperties:
                type: integer
              description: >-
                Matching records per status. Honours the search and set filters and
                ignores the single-status filter, so counts stay stable as filters
                change.
            unfiltered_total:
              type: integer
              description: Records ignoring the status filter and search.

    QueueStatus:
      type: object
      description: |
        Queue counters. `active_destinations` carries the transfer IDs that own
        reserved destinations, not the path strings.
      properties:
        max_concurrent:
          type: integer
        running_count:
          type: integer
        queued_count:
          type: integer
        available_slots:
          type: integer
        running_transfer_ids:
          type: array
          items:
            type: string
        queued_transfer_ids:
          type: array
          items:
            type: string
        active_destinations:
          type: array
          items:
            type: string

    DryRunResult:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        dry_run_result:
          type: object
          description: Simulated rsync outcome; api.md lists the fields.
          additionalProperties: true

    VerificationResult:
      type: object
      description: |
        Rename verification outcome. `result.status` is `verified`, `partial` or
        `failed`; the HTTP code reports whether the check ran, not whether it
        passed.
      properties:
        status:
          type: string
          enum: [success, error]
        result:
          type: object
          properties:
            notification_id:
              type: string
            series_title:
              type: string
            media_type:
              type: string
            status:
              type: string
              enum: [verified, partial, failed]
            total_files:
              type: integer
            verified_count:
              type: integer
            failed_count:
              type: integer
            verified_at:
              type: string
            message:
              type: string
            files:
              type: array
              items:
                type: object
                additionalProperties: true

  responses:
    Success:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:

  # ==================== AUTHENTICATION ====================

  /auth/login:
    post:
      tags: [Authentication]
      summary: Exchange username and password for an access token and a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required: [username, password]
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  token:
                    type: string
                  refresh_token:
                    type: string
                  expires_at:
                    type: string
                  refresh_expires_at:
                    type: string
                  user:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Backend authentication is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out the current user (client-side logout for a stateless JWT flow)
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/verify:
    get:
      tags: [Authentication]
      summary: Report whether the supplied access token is still valid
      security: []
      responses:
        '200':
          description: Always success; read `valid` for the answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  valid:
                    type: boolean
                  user:
                    type: string
                  remaining_seconds:
                    type: integer
                  message:
                    type: string

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange a valid refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required: [refresh_token]
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  token:
                    type: string
                  expires_at:
                    type: string
                  user:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/status:
    get:
      tags: [Authentication]
      summary: Report whether authentication is configured on this server
      security: []
      responses:
        '200':
          description: Auth configuration state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  auth_configured:
                    type: boolean
                  account_count:
                    type: integer
                  using_fallback_account:
                    type: boolean
                    description: >-
                      True while no enabled administrator exists in the database,
                      which is when the environment-file credentials are accepted.
                  message:
                    type: string

  /auth/me:
    get:
      tags: [Authentication]
      summary: Report who the caller is signed in as
      responses:
        '200':
          description: The caller's identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  user:
                    type: string
                  account_id:
                    type: integer
                    nullable: true
                    description: Stable identity; survives a username change. Null for the fallback account.
                  role:
                    type: string
                  must_change_password:
                    type: boolean
                  is_fallback_account:
                    type: boolean
                  can_change_password:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: >-
        Change your own password. There is no endpoint for changing anyone
        else's — that is scripts/manage_admins.py on the server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 10
      responses:
        '200':
          description: >-
            Password changed. Retires every token the account held, including the
            caller's, so a replacement token pair is returned for this browser to
            adopt. Every other session for the account is signed out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  token:
                    type: string
                  refresh_token:
                    type: string
                  expires_at:
                    type: string
                  refresh_expires_at:
                    type: string
                  user:
                    type: string
                  account_id:
                    type: integer
                    nullable: true
                  role:
                    type: string
                  must_change_password:
                    type: boolean
                  is_fallback_account:
                    type: boolean
        '400':
          description: >-
            Missing body, new password under 10 characters (WEAK_PASSWORD),
            unchanged from the current one (PASSWORD_UNCHANGED), or the caller is
            the environment-file fallback account (FALLBACK_ACCOUNT)
        '401':
          description: The current password is wrong, or there is no session

  # ==================== ACTIVITY ====================

  /activity:
    get:
      tags: [Activity]
      summary: >-
        Read the activity trail — who did what, and when — newest first.
        Read-only; nothing writes to or edits the trail through the API
      parameters:
        - { name: actor, in: query, schema: { type: string }, description: A username, or an automation name such as auto-sync }
        - { name: actor_kind, in: query, schema: { type: string, enum: [admin, automated, system] } }
        - { name: account_id, in: query, schema: { type: integer }, description: Stable account id; survives a rename }
        - { name: action, in: query, schema: { type: string }, description: One exact action (backup.restore), or several comma-separated meaning any of them (backup.delete,backup.retention_apply) }
        - { name: group, in: query, schema: { type: string }, description: An action family, e.g. backup }
        - { name: target_type, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [ok, failed, refused] } }
        - { name: since, in: query, schema: { type: string } }
        - { name: until, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of the trail, with the total behind it
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        occurred_at: { type: string }
                        actor_kind: { type: string, enum: [admin, automated, system] }
                        actor_name: { type: string }
                        actor_account_id: { type: integer, nullable: true }
                        action: { type: string }
                        target_type: { type: string, nullable: true }
                        target_id: { type: string, nullable: true }
                        target_label: { type: string, nullable: true }
                        summary: { type: string }
                        detail: { type: object, nullable: true }
                        outcome: { type: string, enum: [ok, failed, refused] }
                        request_ip: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /activity/for/{target_type}/{target_id}:
    get:
      tags: [Activity]
      summary: Everything recorded against one thing, oldest first
      parameters:
        - { name: target_type, in: path, required: true, schema: { type: string } }
        - { name: target_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /activity/filters:
    get:
      tags: [Activity]
      summary: >-
        What the activity screen can filter by. Actors come from the trail, so
        someone whose account was disabled still appears
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== CONFIGURATION AND SSH ====================

  /config:
    get:
      tags: [Configuration]
      summary: >-
        Return every setting grouped for React, plus a deprecated flat compatibility
        shape. Each grouped setting says which store owns it and whether it can be changed here
      responses:
        '200':
          description: Configuration object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Configuration]
      summary: >-
        Write the database-backed settings in the payload. Environment-owned keys are
        refused by name and listed in `refused`. The whole payload is validated before
        anything is written, so a 400 means nothing changed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigObject'
      responses:
        '200':
          description: >-
            Saved. Carries `saved` and `refused` key lists alongside the full GET payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSaveResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /config/reset:
    post:
      tags: [Configuration]
      summary: >-
        Deprecated cutover compatibility endpoint. There is no per-browser override
        layer left to clear, so this reports success and changes nothing
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /config/env-only:
    get:
      tags: [Configuration]
      summary: >-
        Deprecated cutover compatibility endpoint returning environment-backed settings
      responses:
        '200':
          description: Configuration object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigObject'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /connect:
    post:
      tags: [Configuration]
      summary: Open an SSH connection to the remote server and attach it to the runtime
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                username:
                  type: string
                password:
                  type: string
                key_path:
                  type: string
      responses:
        '200':
          description: |
            Connection attempted. A missing field or a failed connection is
            reported in the body as `status: error`, still with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Body was valid JSON but not an object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /disconnect:
    post:
      tags: [Configuration]
      summary: Close the current SSH connection and clear connection state
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auto-connect:
    get:
      tags: [Configuration]
      summary: Connect over SSH using the configured environment credentials
      responses:
        '200':
          description: |
            Connection attempted. Missing credentials or a failed connection are
            reported in the body as `status: error`, still with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ssh-config:
    get:
      tags: [Configuration]
      summary: Return the loaded SSH settings, with the password reduced to a boolean
      responses:
        '200':
          description: SSH settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  host:
                    type: string
                  username:
                    type: string
                  key_path:
                    type: string
                  has_password:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== MEDIA BROWSING ====================

  /media-types:
    get:
      tags: [Media Browsing]
      summary: List the three media types and their configured source paths
      responses:
        '200':
          description: Media type list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    path:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /media/dry-run:
    post:
      tags: [Media Browsing]
      summary: Preview an rsync for a chosen media folder without changing any file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                media_type:
                  type: string
                  enum: [movies, tvshows, anime]
                folder_name:
                  type: string
                season_name:
                  type: string
                  description: Optional; series and anime only.
              required: [media_type, folder_name]
      responses:
        '200':
          description: Dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== TRANSFERS ====================

  /transfer:
    post:
      tags: [Transfers]
      summary: Start a transfer, or queue it when a slot or the destination path is busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [folder, file]
                media_type:
                  type: string
                  enum: [movies, tvshows, anime]
                folder_name:
                  type: string
                season_name:
                  type: string
                episode_name:
                  type: string
                  description: Required when type is `file`.
              required: [media_type, folder_name]
      responses:
        '200':
          description: Transfer admitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  transfer_id:
                    type: string
                  transfer_state:
                    type: string
                  message:
                    type: string
                  source:
                    type: string
                  destination:
                    type: string
                  episode_name:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfer/{transfer_id}/status:
    get:
      tags: [Transfers]
      summary: Return one transfer with its progress and log summary
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Transfer object
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  transfer:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfer/{transfer_id}/logs:
    get:
      tags: [Transfers]
      summary: Return the full stored log lines for one transfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Log lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  logs:
                    type: array
                    items:
                      type: string
                  log_count:
                    type: integer
                  transfer_status:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfer/{transfer_id}/cancel:
    post:
      tags: [Transfers]
      summary: Cancel a transfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: |
            Cancellation attempted. A failure is reported in the body as
            `status: error`, still with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfer/{transfer_id}/pause:
    post:
      tags: [Transfers]
      summary: Stop a running transfer but keep its partial files and free its queue slot
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          description: Only a running transfer can be paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /transfer/{transfer_id}/resume:
    post:
      tags: [Transfers]
      summary: Resume a paused transfer from its partial files, re-queueing it if no slot is free
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: |
            Resumed, or queued because no slot was free - the message says
            which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Not paused, or another transfer now owns the destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /transfer/{transfer_id}/restart:
    post:
      tags: [Transfers]
      summary: Restart a failed or cancelled transfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfer/{transfer_id}/delete:
    post:
      tags: [Transfers]
      summary: Delete a transfer record; a running transfer must be cancelled first
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: |
            Deletion attempted. A refusal, such as a still-running transfer, is
            reported in the body as `status: error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfers/all:
    get:
      tags: [Transfers]
      summary: List one page of transfer history, filtered, searched and paged in SQL
      parameters:
        - $ref: '#/components/parameters/Limit50'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/StatusesFilter'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Transfer list; carries `log_count` but never the log bodies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTransferList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfers/bulk-delete:
    post:
      tags: [Transfers]
      summary: Delete several transfer records, by id or by re-running a filter
      description: >-
        With `all_matching`, the filter is re-evaluated on the server rather
        than trusting a list of ids, so "select all" means every match and not
        only the rows a client had loaded; `ids` is then ignored. Transfers that
        are still running are never deleted and come back in `skipped`.
        Deleting completed records also removes the sync history Browse Media
        reads, so the media they copied will show as not yet synced.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                all_matching:
                  type: boolean
                status:
                  type: string
                statuses:
                  type: array
                  items:
                    type: string
                search:
                  type: string
      responses:
        '200':
          description: How many records were deleted, and which were left alone
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  deleted_count:
                    type: integer
                  skipped:
                    type: array
                    items:
                      type: string
                    description: Ids of transfers left alone because they are still running.
                  message:
                    type: string
        '400':
          description: '`ids` was present but not a list'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Deletion failed

  /transfers/active:
    get:
      tags: [Transfers]
      summary: List currently active transfers together with queue state
      responses:
        '200':
          description: Active transfers and queue counters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TransferList'
                  - type: object
                    properties:
                      queue_status:
                        $ref: '#/components/schemas/QueueStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfers/queue/status:
    get:
      tags: [Transfers]
      summary: Return queue counters only
      responses:
        '200':
          description: Queue counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  queue:
                    $ref: '#/components/schemas/QueueStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfers/cleanup:
    post:
      tags: [Transfers]
      summary: Remove duplicate transfer records per destination, keeping the latest successful one
      responses:
        '200':
          description: Cleanup summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  cleaned_count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

