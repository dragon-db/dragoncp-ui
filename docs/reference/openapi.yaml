  # ==================== DEBUG AND DIAGNOSTICS ====================

  /runtime/status:
    get:
      tags: [Debug]
      summary: Return the lightweight connectivity state the frontend shell polls, including the running server's version
      responses:
        '200':
          description: Runtime status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  runtime_status:
                    type: object
                    additionalProperties: true
                    properties:
                      version:
                        type: string
                        description: The release the server is running, from the VERSION file. "unknown" when it could not be read.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /debug:
    get:
      tags: [Debug]
      summary: Return a wide diagnostic snapshot of config, SSH, websocket and transfer state
      responses:
        '200':
          description: Diagnostic snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  debug_info:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /debug/transfers:
    get:
      tags: [Debug]
      summary: Return database-focused transfer diagnostics
      responses:
        '200':
          description: Transfer diagnostics
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  debug_info:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /websocket/status:
    get:
      tags: [Debug]
      summary: Report the websocket connection count and per-connection timing
      responses:
        '200':
          description: Websocket status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  websocket_status:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /local-files:
    get:
      tags: [Debug]
      summary: List the files in a local directory
      parameters:
        - name: path
          in: query
          required: false
          schema:
            type: string
            default: "/"
      responses:
        '200':
          description: File names
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  files:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /disk-usage/local:
    get:
      tags: [Debug]
      summary: Return disk usage for the configured local paths
      responses:
        '200':
          description: Per-path usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  disk_info:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /disk-usage/remote:
    get:
      tags: [Debug]
      summary: Call the configured remote disk API and normalise its storage figures
      responses:
        '200':
          description: Remote storage figures
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  storage_info:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== SERVER LOGS ====================

  /logs:
    get:
      tags: [Logs]
      summary: Return recent backend log records matching the requested severity
      description: >-
        Matching is not uniformly "level and above". ALL returns everything,
        ERROR returns ERROR and CRITICAL, WARNING returns WARNING, ERROR and
        CRITICAL, and DEBUG, INFO and CRITICAL match that level exactly. An
        unrecognised value is coerced to ERROR.
      parameters:
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL, ALL]
            default: ERROR
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            maximum: 1000
        - name: search
          in: query
          required: false
          description: Case-insensitive substring match.
          schema:
            type: string
      responses:
        '200':
          description: Log records
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  log_file:
                    type: string
                  level:
                    type: string
                  limit:
                    type: integer
                  line_count:
                    type: integer
                  size_bytes:
                    type: integer
                  last_modified:
                    type: string
                    format: date-time
                  lines:
                    type: array
                    description: Oldest first.
                    items:
                      type: object
                      properties:
                        level:
                          type: string
                        text:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /logs/download:
    get:
      tags: [Logs]
      summary: Download the whole backend log file as an attachment
      responses:
        '200':
          description: The live log file as an attachment. Rotated files are not served.
          content:
            text/plain:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Log file is not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== SIMULATION ====================

  /simulation/status:
    get:
      tags: [Simulation]
      summary: List the available scenarios and what is currently on the board
      responses:
        '200':
          description: Scenarios and current simulation state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  scenarios:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: integer
                  by_status:
                    type: object
                    additionalProperties: true
                  finished:
                    type: boolean
                  disk_bytes:
                    type: integer
                  real_transfers_running:
                    type: integer
                  max_concurrent:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /simulation/start:
    post:
      tags: [Simulation]
      summary: Generate fixture files and run a scenario through the real transfer pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario:
                  type: string
                  enum: [queue_overflow, path_conflict, slow_copy, failure, season_batch]
                confirm_busy:
                  type: boolean
                  description: Required to proceed when real transfers are running.
              required: [scenario]
      responses:
        '200':
          description: Simulation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  run_id:
                    type: string
                  transfer_ids:
                    type: array
                    items:
                      type: string
        '400':
          description: Unknown scenario, a simulation already on the board, a scenario above the size ceiling, or too little free disk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Real transfers are running and confirm_busy was not set
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  code:
                    type: string
                    enum: [real_transfers_running]
                  message:
                    type: string
                  running:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /simulation/stop:
    post:
      tags: [Simulation]
      summary: Cancel simulated transfers that are still moving, leaving their rows in place
      responses:
        '200':
          description: Stop summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  stopped:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /simulation/cleanup:
    post:
      tags: [Simulation]
      summary: Remove every simulation row, the simulation's sync runs and the files it generated
      responses:
        '200':
          description: Cleanup summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  transfers_removed:
                    type: integer
                  notifications_removed:
                    type: integer
                  files_removed:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /explore/libraries:
    get:
      tags: [Explore]
      summary: The three libraries, their configured paths and when each was last compared
      responses:
        '200':
          description: Library list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  libraries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, enum: [movies, tvshows, anime] }
                        label: { type: string }
                        remote_path: { type: string }
                        local_path: { type: string }
                        configured: { type: boolean }
                        local_exists: { type: boolean }
                        checked_at: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /explore/tree/{media_type}:
    get:
      tags: [Explore]
      summary: Every series in one library with rolled-up status and its seasons
      parameters:
        - name: media_type
          in: path
          required: true
          schema: { type: string, enum: [movies, tvshows, anime] }
        - name: refresh
          in: query
          required: false
          description: "1 forces a fresh comparison; rate limited"
          schema: { type: string }
      responses:
        '200':
          description: Series list, with `stale` true when served from cache
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: No remote browse session
        '429':
          description: Rate limited (12 comparisons per minute per user)

  /explore/series/{media_type}/{folder}:
    get:
      tags: [Explore]
      summary: One series with its seasons, from a fresh comparison
      parameters:
        - name: media_type
          in: path
          required: true
          schema: { type: string }
        - name: folder
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Series with seasons
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown library or series
        '429':
          description: Rate limited

  /explore/season/{media_type}/{folder}/{season}:
    get:
      tags: [Explore]
      summary: One season's episodes, each labelled IN_SYNC / NESTED / MISSING / UPGRADED / LOCAL_ONLY
      parameters:
        - name: media_type
          in: path
          required: true
          schema: { type: string }
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - name: season
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Season with episodes
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown library, series or season
        '429':
          description: Rate limited

  /explore/history/{media_type}/{folder}:
    get:
      tags: [Explore]
      summary: Past Explore runs for this series, with per-file records
      parameters:
        - name: media_type
          in: path
          required: true
          schema: { type: string }
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - name: season
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Runs, newest first
        '401':
          $ref: '#/components/responses/Unauthorized'

  /explore/backups/{media_type}/{folder}:
    get:
      tags: [Explore]
      summary: Copies an earlier sync moved aside for this series or season; backup_id is the capture id used by the /backups restore endpoints
      parameters:
        - name: media_type
          in: path
          required: true
          schema: { type: string }
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - name: season
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: "Backup runs; shown_count/shown_size describe what survives the season filter"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /explore/repair/{media_type}/{folder}:
    get:
      tags: [Explore]
      summary: What repairing the misplaced files here would do; moves nothing
      description: >-
        Local only. Works with the browse session down, because a repair never
        asks the remote anything. `blocked` names what will not be touched and
        why; `blocker` is set when the repair cannot run at all right now.
      parameters:
        - name: media_type
          in: path
          required: true
          schema: { type: string }
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - name: season
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: >-
            Repair plan. Each action carries a `rival` (and `needs_decision`)
            when another copy of the same episode or film is already in place,
            found by identity rather than filename.
        '400':
          description: Invalid folder or season name
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown library
    post:
      tags: [Explore]
      summary: Move the misplaced files back into place
      description: >-
        The plan is rebuilt server-side from the disk as it is now, so the body
        cannot name a file to move. Nothing is renamed and nothing is
        overwritten.
      parameters:
        - name: media_type
          in: path
          required: true
          schema: { type: string }
        - name: folder
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                season: { type: string, nullable: true }
                decisions:
                  type: object
                  description: >-
                    For contested files only, keyed by the stranded file's
                    relative path. `keep_existing` deletes the stranded copy;
                    `replace` removes the copy in place and promotes the
                    stranded one. A contested file with no decision is left
                    alone and reported in `failed`. The losing copy is captured
                    into the backup area first, so either answer is reversible.
                    `rival` must be the copy the preview showed; if the disk no
                    longer agrees, the decision is refused rather than applied
                    to a file nobody looked at.
                  additionalProperties:
                    type: object
                    required: [choice, rival]
                    properties:
                      choice:
                        type: string
                        enum: [keep_existing, replace]
                      rival: { type: string }
      responses:
        '200':
          description: "moved / deleted / replaced / failed, with counts, freed bytes and folders removed"
        '400':
          description: Nothing in scope can be repaired automatically
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A transfer is active against this title, or that could not be checked

  /explore/plan:
    post:
      tags: [Explore]
      summary: Evaluate an operation and store it for approval; writes nothing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_type, operation, folder]
              properties:
                media_type: { type: string, enum: [movies, tvshows, anime] }
                operation:
                  type: string
                  enum: [sync_series, sync_seasons, sync_season, download, replace]
                folder: { type: string }
                season: { type: string, nullable: true }
                seasons:
                  type: array
                  items: { type: string }
                codes:
                  type: array
                  items: { type: string }
                include_removals: { type: boolean, default: true }
      responses:
        '200':
          description: The plan, its verdict, safety checks and plan_id
        '400':
          description: Unknown operation or invalid folder name
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown library, series or season
        '409':
          description: No remote browse session
        '429':
          description: Rate limited
        '502':
          description: The remote listing failed

  /explore/dry-run:
    post:
      tags: [Explore]
      summary: Rehearse a plan with rsync --dry-run; leaves the plan runnable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: string }
      responses:
        '200':
          description: "What rsync says, reconciled against the plan"
        '400':
          description: plan_id missing
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The plan expired or was already used
        '429':
          description: Rate limited
        '503':
          description: Dry run unavailable on this server

  /explore/transfer:
    post:
      tags: [Explore]
      summary: Execute a stored plan; consumes it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: string }
                override:
                  type: boolean
                  description: Required when the plan failed its safety checks
                confirm_text:
                  type: string
                  description: Must equal the season label, or the series name when there is none
      responses:
        '200':
          description: "Started or queued; transfer_id is null for a removals-only plan"
        '400':
          description: plan_id missing
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The plan expired or was already used
        '422':
          description: Failed its checks and needs an override plus the typed confirmation
        '500':
          description: The run could not be started; any moved files were rolled back

  /webhook/series/notifications/sync-batch:
    post:
      tags: [Webhooks - Management]
      summary: Sync a group of notifications as one manual run per destination folder (one per season)
      description: >-
        The grouping is re-derived on the server from each notification's
        destination folder; ids are looked up in both notification tables.
        Notifications already completed, or riding on a run that is copying
        right now, are skipped and named in `message`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notification_ids]
              properties:
                notification_ids:
                  type: array
                  minItems: 1
                  items: { type: string, minLength: 1 }
      responses:
        '200':
          description: One run per folder
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  transfer_ids:
                    type: array
                    maxItems: 0
                    items: { type: string }
                    description: >-
                      Always empty: each run creates its transfer once its safety
                      check passes, after this call returns.
                  run_ids:
                    type: array
                    items: { type: string }
        '400':
          description: >-
            Empty or non-list notification_ids, a non-string id, or nothing in
            the group could be synced (`status: error`, with `message` and
            `run_ids`)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==================== SYNC ENGINE ====================
  #
  # Every sync is a run through nine stages: receive, identify, batch, ready,
  # safety, queue, transfer, finish, tell. Every endpoint below answers 503
  # with "The sync engine is not running" when the engine, the alert service
  # or the scheduler is not wired up. See api.md section 13.

  /sync/catalogue:
    get:
      tags: [Sync Engine]
      summary: The stages, every kind of sync and how it runs each stage, the run states and the alert vocabulary
      responses:
        '200':
          description: The pipeline the engine runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  stages:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        label: { type: string }
                        tagline: { type: string }
                        description: { type: string }
                  kinds:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        label: { type: string }
                        description: { type: string }
                        mergeable: { type: boolean }
                        stages:
                          type: object
                          description: Stage id -> {mode, note}; mode is run, diff or skip.
                          additionalProperties:
                            type: object
                            properties:
                              mode: { type: string, enum: [run, diff, skip] }
                              note: { type: string }
                  stage_statuses:
                    type: array
                    items: { type: string }
                  states:
                    type: object
                    description: open, active and terminal state lists, and a label per state
                    additionalProperties: true
                  state_groups:
                    type: object
                    description: The groups /sync/runs?state= accepts - open, active, live, finished
                    additionalProperties:
                      type: array
                      items: { type: string }
                  alert_actions:
                    type: object
                    additionalProperties: { type: string }
                  alert_kinds:
                    type: object
                    additionalProperties: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sync/runs:
    get:
      tags: [Sync Engine]
      summary: One page of runs, newest first, each with its stage strip
      parameters:
        - name: state
          in: query
          required: false
          description: >-
            One state, several comma-separated, or one group - open, active,
            live, finished, all (the default).
          schema: { type: string, default: all }
        - name: kind
          in: query
          required: false
          description: One kind, or several comma-separated.
          schema: { type: string }
        - name: search
          in: query
          required: false
          description: >-
            Title, folder, season, destination path, run id or transfer id. `q`
            is accepted as well.
          schema: { type: string }
        - name: simulations
          in: query
          required: false
          description: 0, false or no leaves simulation runs out.
          schema: { type: string }
        - name: copied
          in: query
          required: false
          description: >-
            0 (false, no) keeps only runs whose Transfer stage never started; 1
            (true, yes) only runs whose copy started. Absent keeps both.
          schema: { type: string }
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: >-
            Runs. `total` honours every filter; `state_counts` honours only
            `simulations`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  limit: { type: integer }
                  offset: { type: integer }
                  total: { type: integer }
                  state_counts:
                    type: object
                    additionalProperties: { type: integer }
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncRunSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /sync/runs/{run_id}:
    get:
      tags: [Sync Engine]
      summary: One run in full - every stage with its summary, detail and log lines, its webhooks, transfer, related runs, alerts and available actions
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  run:
                    allOf:
                      - $ref: '#/components/schemas/SyncRunSummary'
                      - type: object
                        properties:
                          source_path: { type: string, nullable: true }
                          dest_path: { type: string, nullable: true }
                          operation_type: { type: string, nullable: true }
                          ready_mode:
                            type: string
                            nullable: true
                            description: "`ask` (asking Sonarr), `timer` (the fallback timer), or null before the ready check decides"
                          checks_made: { type: integer }
                          timer_due_at: { type: string, nullable: true }
                          ready_deadline_at: { type: string, nullable: true }
                          force_safety: { type: boolean }
                          stage_detail:
                            type: array
                            description: Nine entries in stage order, each with its own `events`.
                            items:
                              type: object
                              additionalProperties: true
                          webhooks:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
                          transfer:
                            type: object
                            nullable: true
                            additionalProperties: true
                          related:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
                          alerts:
                            type: array
                            items:
                              $ref: '#/components/schemas/Alert'
                          actions:
                            type: array
                            items:
                              type: string
                              enum: [go_now, cancel, sync_anyway, restart]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /sync/runs/{run_id}/events:
    get:
      tags: [Sync Engine]
      summary: A run's log lines after a given event id, optionally for one stage
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: after
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: stage
          in: query
          required: false
          schema:
            type: string
            enum: [receive, identify, batch, ready, safety, queue, transfer, finish, tell]
      responses:
        '200':
          description: Log lines, oldest first (at most 2,000 are kept per run)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        run_id: { type: string }
                        stage: { type: string }
                        level: { type: string, enum: [info, success, warning, error] }
                        message: { type: string }
                        data: { type: object, nullable: true, additionalProperties: true }
                        created_at: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /sync/lookup:
    get:
      tags: [Sync Engine]
      summary: The run behind a transfer or a webhook notification
      parameters:
        - name: transfer_id
          in: query
          required: false
          description: Used when both are given.
          schema: { type: string }
        - name: notification_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The run as a list row (`webhook_count` is null here)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  run_id: { type: string }
                  run:
                    $ref: '#/components/schemas/SyncRunSummary'
        '400':
          description: Neither transfer_id nor notification_id was given
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Nothing links to a run, e.g. a transfer or notification from before the sync engine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sync/runs/{run_id}/go-now:
    post:
      tags: [Sync Engine]
      summary: Send a held or waiting run on now; it skips the rest of the ready check
      description: >-
        For a run past the ready check that has not finished, it changes nothing
        and still answers 200, with a message saying the sync is already on its
        way. A run that has already ended answers 409. A Sonarr, Radarr or
        auto-scanner run sent on this way counts as a manual sync from then on.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Promoted, or already on its way
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunActionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The run already ended (`This sync already ended.`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunActionResult'

  /sync/runs/{run_id}/cancel:
    post:
      tags: [Sync Engine]
      summary: Cancel a run that has not finished, and its transfer if it has one in the queue or copying
      description: >-
        A queued run whose transfer row has gone (deleted from the transfer
        list) has no transfer to cancel and is closed directly.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunActionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The run already ended, or its transfer could not be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunActionResult'

  /sync/runs/{run_id}/sync-anyway:
    post:
      tags: [Sync Engine]
      summary: Go ahead with a run the safety check stopped; it is handed to the queue in this request
      description: >-
        A queue that refuses the transfer answers 409, with `state: failed` and
        the reason in `message`.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Handed to the queue; `transfer_id` is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunActionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The run is not refused, another sync for the same folder is already on its way, or the queue refused the transfer (`state` is `failed`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunActionResult'

  # ==================== ALERTS (NOTIFICATIONS PAGE) ====================

  /alerts:
    get:
      tags: [Alerts]
      summary: Alerts, newest first, with the open counts
      parameters:
        - name: state
          in: query
          required: false
          description: >-
            open, done, wrong or dismissed; several of them comma-separated
            (the Closed tab sends done,wrong,dismissed); or all.
          schema:
            type: string
            default: open
            example: done,wrong,dismissed
        - name: kind
          in: query
          required: false
          description: One kind, or several comma-separated.
          schema: { type: string }
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: >-
            Alerts. `total` counts the requested states and `kind`; `open` and
            `by_severity` always describe open alerts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  limit: { type: integer }
                  offset: { type: integer }
                  total: { type: integer }
                  open: { type: integer }
                  by_severity:
                    type: object
                    additionalProperties: { type: integer }
                  alerts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /alerts/summary:
    get:
      tags: [Alerts]
      summary: How many alerts are open, in total and by severity - the header bell and the sidebar count
      responses:
        '200':
          description: Open counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /alerts/{alert_id}/action:
    post:
      tags: [Alerts]
      summary: Do what the alert's button says, then close the alert
      description: >-
        `dismiss` is accepted on any open alert; every other action must be one
        the alert offers. If the action itself fails the alert stays open.
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [sync_now, retry, sync_anyway, run_now, mark_done, mark_wrong, dismiss]
      responses:
        '200':
          description: Done; the alert is closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  alert:
                    $ref: '#/components/schemas/Alert'
        '400':
          description: Missing or unknown action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The alert is already closed, the action is not one it offers, or
            the action failed. The body carries `message` and the alert.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  alert:
                    $ref: '#/components/schemas/Alert'

  # ==================== SCHEDULER ====================

  /scheduler/jobs:
    get:
      tags: [Scheduler]
      summary: Every background job with its switch, interval, last run, last result and next run
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/SchedulerJob'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /scheduler/jobs/{name}/run:
    post:
      tags: [Scheduler]
      summary: Run a job now, whatever its schedule; returns once it has started
      parameters:
        - $ref: '#/components/parameters/JobName'
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  job:
                    $ref: '#/components/schemas/SchedulerJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The job is already running; a job never overlaps itself
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  job:
                    $ref: '#/components/schemas/SchedulerJob'

  # ==================== MEDIA LIBRARY ====================
  #
  # Errors here are `{"success": false, "error": "..."}`, not the `status`
  # envelope. Every endpoint answers 404 for an unknown source and 503 when the
  # title index is not available. Sonarr and Radarr are only ever read.

  /library/{source}:
    get:
      tags: [Media Library]
      summary: One row per title the service holds, with what this disk holds beside it and a verdict
      description: >-
        Each title's `sync_state` is worked out from one catalogue read, the
        service's imports of the last 14 days and the disk, with no call per
        title; a title opened through `/library/{source}/{external_id}` in the
        last ten minutes carries that exact answer instead (`state_exact`).
        Until 2026-10-06 the states were synced, partial, never, no_files,
        orphan and unknown.
      parameters:
        - $ref: '#/components/parameters/LibrarySource'
        - name: refresh
          in: query
          required: false
          description: 1, true or yes pulls the service's whole catalogue into the index first.
          schema: { type: string }
      responses:
        '200':
          description: Library view
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  source: { type: string }
                  live:
                    type: boolean
                    description: False when the service could not be read and the index answered instead.
                  history_checked:
                    type: boolean
                    description: False when the import history could not be read; only the counts were compared.
                  total: { type: integer }
                  counts:
                    type: object
                    description: Titles per sync_state.
                    additionalProperties: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        external_id: { type: string }
                        title: { type: string, nullable: true }
                        sync_state:
                          type: string
                          enum: [out_of_sync, needs_repair, in_sync, kept_here, never, no_files, orphan, unknown]
                        state_reason: { type: string }
                        state_exact: { type: boolean }
                        attention:
                          type: array
                          description: Why it is out of sync.
                          items:
                            type: object
                            additionalProperties: true
                            properties:
                              kind:
                                type: string
                                enum: [new_import, new_file, short, season_not_here, missing, different]
                              season_number: { type: integer, nullable: true }
                              count: { type: integer }
                        kept_here_count: { type: integer }
                        last_import_at: { type: string, nullable: true }
                        service_files_counted: { type: integer }
                        episodes_here: { type: integer }
                  read_only: { type: boolean }
                  test_mode: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
        '500':
          description: The view failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'

  /library/{source}/history:
    get:
      tags: [Media Library]
      summary: A page of the service's own history, each row with its title and episode, titles the index knows matched in
      parameters:
        - $ref: '#/components/parameters/LibrarySource'
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: event
          in: query
          required: false
          description: One kind of event, filtered by the service so `total` is the filtered count.
          schema:
            type: string
            enum: [all, imported, grabbed, deleted, failed, renamed, ignored]
            default: all
      responses:
        '200':
          description: History page; `live` false with a `message` when the service cannot be read
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  success: { type: boolean }
                  source: { type: string }
                  live: { type: boolean }
                  event: { type: string }
                  records:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        event_type: { type: string, description: The service's own event name. }
                        event:
                          type: string
                          enum: [imported, grabbed, deleted, failed, renamed, ignored, other]
                        event_label: { type: string }
                        date: { type: string }
                        title: { type: string, nullable: true }
                        year: { type: integer, nullable: true }
                        episode_code: { type: string, nullable: true, example: S01E08 }
                        episode_label: { type: string, nullable: true, example: 1x08 }
                        episode_title: { type: string, nullable: true }
                        quality: { type: string, nullable: true }
                        custom_formats:
                          type: array
                          items: { type: string }
                        custom_format_score: { type: integer, nullable: true }
                        source_title: { type: string, nullable: true }
                        download_client: { type: string, nullable: true }
                        reason: { type: string, nullable: true }
                        external_id: { type: string, nullable: true }
                        known_here: { type: boolean }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
                  read_only: { type: boolean }
        '400':
          description: page or page_size is not a number, or event is not a known kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'

  /library/{source}/queue:
    get:
      tags: [Media Library]
      summary: What is waiting on the service and why, rows needing attention first
      parameters:
        - $ref: '#/components/parameters/LibrarySource'
      responses:
        '200':
          description: Queue view; `live` false with a `message` when the service cannot be read
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  success: { type: boolean }
                  source: { type: string }
                  live: { type: boolean }
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        title: { type: string }
                        year: { type: integer, nullable: true }
                        episode_code: { type: string, nullable: true }
                        episode_title: { type: string, nullable: true }
                        quality: { type: string, nullable: true }
                        verdict: { type: string }
                        holds_sync: { type: boolean }
                        status_label: { type: string, example: Stuck }
                        status_detail: { type: string }
                        status_text: { type: string, example: 'Stuck: The download is stalled with no connections' }
                        tone:
                          type: string
                          enum: [brand, warn, crit, ok, muted]
                        progress: { type: number }
                        seconds_left: { type: integer, nullable: true }
                        download_client: { type: string, nullable: true }
                        external_id: { type: string, nullable: true }
                  counts:
                    type: object
                    additionalProperties: { type: integer }
                  total: { type: integer }
                  needing_attention: { type: integer }
                  holding_a_sync: { type: integer }
                  read_only: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'

  /library/{source}/{external_id}:
    get:
      tags: [Media Library]
      summary: One title compared episode by episode, with what to do about it
      description: >-
        Episode states are in_sync, different, missing_here, nested, only_here
        and not_downloaded; the title is out_of_sync exactly when an episode
        outside Specials is missing_here or different, and needs_repair when
        neither but a media file sits in a nested folder. A film carries `movie`
        instead of `seasons`. `actions.sync.offered` is true only where the
        title's Sync would copy season folders holding nothing kept only here;
        `actions.explore` names where Explore fetches only the missing files.
      parameters:
        - $ref: '#/components/parameters/LibrarySource'
        - name: external_id
          in: path
          required: true
          description: TVDB id for Sonarr, TMDB id for Radarr.
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: >-
            The comparison; `live` false with a `message` when the service is
            not connected or does not answer
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  success: { type: boolean }
                  live: { type: boolean }
                  found: { type: boolean }
                  message: { type: string }
                  title:
                    type: object
                    additionalProperties: true
                  state:
                    type: string
                    enum: [out_of_sync, needs_repair, in_sync, kept_here, never, no_files, orphan, unknown]
                  summary: { type: string }
                  counts:
                    type: object
                    additionalProperties: { type: integer }
                  seasons:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        season_number: { type: integer }
                        counts_towards_state: { type: boolean }
                        folder_here: { type: string, nullable: true }
                        service_folder: { type: string, nullable: true }
                        explore_season: { type: string }
                        last_synced_at: { type: string, nullable: true }
                        episodes:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                            properties:
                              code: { type: string, example: S01E08 }
                              title: { type: string, nullable: true }
                              air_date: { type: string, nullable: true }
                              state:
                                type: string
                                enum: [in_sync, different, missing_here, nested, only_here, not_downloaded]
                              service_file:
                                type: object
                                nullable: true
                                additionalProperties: true
                              local_file:
                                type: object
                                nullable: true
                                additionalProperties: true
                  movie:
                    type: object
                    nullable: true
                    additionalProperties: true
                  attention:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  actions:
                    type: object
                    properties:
                      sync:
                        type: object
                        properties:
                          offered: { type: boolean }
                          seasons:
                            type: array
                            items: { type: integer }
                          reason: { type: string }
                      explore:
                        type: object
                        nullable: true
                        properties:
                          media_type: { type: string, enum: [tvshows, anime, movies] }
                          series: { type: string, nullable: true }
                          season: { type: string, nullable: true }
                  computed_at: { type: string }
        '400':
          description: external_id is not a number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown source, or a title neither the service nor the index knows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'

  /library/{source}/{external_id}/history:
    get:
      tags: [Media Library]
      summary: One title's history, the service's events beside DragonCP's syncs
      description: >-
        Newest first, at most 150 entries. Each entry has `side` (service or
        dragoncp), `kind`, a sentence in `title`, a `detail` line and a
        `status`: done, not_done, failed, in_progress or info. An import's
        status is info; the episode comparison says whether it is here now.
        A burst of the same deletion or rename is one entry. Read-only.
      parameters:
        - $ref: '#/components/parameters/LibrarySource'
        - name: external_id
          in: path
          required: true
          description: TVDB id for Sonarr, TMDB id for Radarr.
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: >-
            The history; `live` false with a `message` when the service did
            not answer, in which case only DragonCP's side is listed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  success: { type: boolean }
                  live: { type: boolean }
                  message: { type: string }
                  total: { type: integer }
                  entries:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        at: { type: string, nullable: true }
                        side: { type: string, enum: [service, dragoncp] }
                        kind: { type: string }
                        title: { type: string }
                        detail: { type: string }
                        status:
                          type: string
                          enum: [done, not_done, failed, in_progress, info]
                        episodes:
                          type: array
                          items: { type: string }
                        run_id: { type: string, nullable: true }
                        season: { type: string, nullable: true }
        '400':
          description: The id is not a number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown source, or a title neither the service nor the index knows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'

  /library/{source}/sync:
    post:
      tags: [Media Library]
      summary: Sync what this disk is missing of one title, as manual runs through the sync engine
      description: >-
        What to fetch is worked out on the server from the service as it is
        now: for Sonarr, each season holding fewer files here than in Sonarr;
        for Radarr, the movie when it is not here. `transfers_started` counts
        the runs the engine accepted - no transfer exists yet when this
        returns. This response used to carry a `decision` object instead of
        `runs`.
      parameters:
        - $ref: '#/components/parameters/LibrarySource'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_id]
              properties:
                external_id:
                  type: string
                  description: TVDB id for Sonarr, TMDB id for Radarr.
      responses:
        '200':
          description: At least one run accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  transfers_started: { type: integer }
                  error: { type: string }
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncRunActionResult'
        '400':
          description: external_id is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
        '409':
          description: >-
            Nothing to start - the service did not answer, the title is not
            recorded, the service holds no files for it, everything is already
            here - or every run was refused (then `runs` is present too)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
        '503':
          description: Syncing from the library view is not available, or the index is not
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'

  /library/{source}/refresh:
    post:
      tags: [Media Library]
      summary: Pull the service's catalogue into the index; writes only to this side's database
      parameters:
        - $ref: '#/components/parameters/LibrarySource'
      responses:
        '200':
          description: Refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  source: { type: string }
                  titles_seen: { type: integer }
                  read_only: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
        '502':
          description: The service did not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
