openapi: 3.0.3
info:
  title: DragonCP API
  description: |
    Machine-readable index of the DragonCP backend HTTP API.

    **`api.md` in this directory is authoritative.** This file exists so the API
    can be imported into an API client or used to generate a stub client. It
    lists every endpoint with its method, path, auth requirement and a one-line
    summary; request and response schemas are deliberately thin and name only
    the common fields. Where the two differ, `api.md` is correct and this file
    needs fixing.

    Written by reading the `@app.route` / `@*_bp.route` decorators in `app.py`
    and `routes/`. Every blueprint is registered under the `/api` prefix, which
    is part of the server URL below, so paths here are written without it.

    `GET /` and `GET /<path>` are not listed: they serve the React application
    shell and are not API routes. The eight `/remote-transfer/*` endpoints
    (`routes/remote_daemon.py`) are not listed yet either; see
    `../features/fast-transfers/README.md`.

    Endpoint count: 143 method+path operations.

    ## Sync runs

    Every sync goes through the sync engine and is a run with a `run_id`. The
    webhook receivers and the manual sync endpoints answer with the run, not a
    transfer: the transfer is only created when the run reaches the queue.

    ## Authentication

    Most endpoints require a JWT access token issued by `POST /auth/login`:

    ```
    Authorization: Bearer <access-token>
    ```

    Query-string tokens (`?token=...`) are not accepted on normal HTTP requests.

    The three webhook receivers do not take a JWT. They are guarded by
    `require_webhook_auth`, which enforces an HMAC `X-DragonCP-Signature` header
    when `WEBHOOK_SECRET` is set and a source-IP allowlist when
    `WEBHOOK_ALLOWED_IPS` is set. When both are set, either check passing is
    enough. When neither is set the receivers are open and the server logs a
    warning.
  version: "2.0.0"
  contact:
    name: DragonCP

servers:
  - url: http://localhost:5000/api
    description: Local development server

tags:
  - name: Authentication
    description: Login, logout, token verification and refresh
  - name: Activity
    description: The read-only activity trail
  - name: Configuration
    description: Runtime configuration and SSH connection management
  - name: Media Browsing
    description: Browse remote media folders and compare them with local copies
  - name: Transfers
    description: Start, monitor, pause, resume and manage rsync transfers
  - name: Webhooks - Receivers
    description: Radarr/Sonarr receivers; webhook auth, not JWT
  - name: Webhooks - Management
    description: List, inspect, sync, complete and delete webhook notifications
  - name: Webhooks - Renames
    description: Rename-event history and on-demand verification
  - name: Webhooks - Settings
    description: Auto-sync switches and the fallback wait
  - name: Connectors
    description: Discord, Sonarr, Radarr and other services; destinations, routing and delivery history
  - name: Backups
    description: Pre-sync backup listing, restore and reindex
  - name: Debug
    description: Diagnostics, runtime status and disk usage
  - name: Logs
    description: Backend log reading and download
  - name: Simulation
    description: Run the real transfer pipeline against throwaway files
  - name: Explore
    description: Compare the remote library with the local one and plan a sync
  - name: Sync Engine
    description: Sync runs, their nine stages and log lines, and acting on a run
  - name: Alerts
    description: The Notifications page - everything that needs a person
  - name: Scheduler
    description: Background jobs on a clock (the Sonarr and Radarr auto-scanners)
  - name: Media Library
    description: Library, Queue and History views of Sonarr and Radarr, and Sync on a title

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from POST /auth/login.
    webhookSignature:
      type: apiKey
      in: header
      name: X-DragonCP-Signature
      description: |
        HMAC-SHA256 of the raw request body, formatted `sha256=<hex digest>`,
        keyed with WEBHOOK_SECRET. Enforced only when WEBHOOK_SECRET is set. A
        request from an address in WEBHOOK_ALLOWED_IPS is accepted without it.

  parameters:
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
    TransferId:
      name: transfer_id
      in: path
      required: true
      schema:
        type: string
    BackupId:
      name: backup_id
      in: path
      required: true
      schema:
        type: string
    MediaType:
      name: media_type
      in: path
      required: true
      schema:
        type: string
        enum: [movies, tvshows, anime]
    FolderName:
      name: folder_name
      in: path
      required: true
      schema:
        type: string
    SeasonName:
      name: season_name
      in: path
      required: true
      schema:
        type: string
    StatusFilter:
      name: status
      in: query
      required: false
      description: Exact status match; omit for all.
      schema:
        type: string
    Limit50:
      name: limit
      in: query
      required: false
      description: Page size. Values above 200 are clamped to 200.
      schema:
        type: integer
        default: 50
        maximum: 200
    Offset:
      name: offset
      in: query
      required: false
      description: Where the page starts, counted in records.
      schema:
        type: integer
        default: 0
    Search:
      name: search
      in: query
      required: false
      description: >-
        Free-text match, applied anywhere in the searched columns. Transfers
        search title, folder, season, source and destination paths and the
        transfer id; notifications search title, paths, release title,
        requester and notification id.
      schema:
        type: string
    StatusesFilter:
      name: statuses
      in: query
      required: false
      description: >-
        Comma-separated statuses to include, e.g. `completed,failed,cancelled`.
        Used where a list covers a set of statuses rather than one.
      schema:
        type: string
    MediaTypeFilter:
      name: media_type
      in: query
      required: false
      description: >-
        `movies`/`movie` selects movie notifications; anything else selects
        series notifications, with `tvshows` also matching the legacy `series`
        value.
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      description: A sync run id, e.g. `run_3f2a9c1d0b7e`.
      schema:
        type: string
    AlertId:
      name: alert_id
      in: path
      required: true
      schema:
        type: string
    JobName:
      name: name
      in: path
      required: true
      description: A scheduler job name, e.g. `sonarr_auto_scanner`.
      schema:
        type: string
    ConnectorId:
      name: connector_id
      in: path
      required: true
      schema:
        type: string
    TargetId:
      name: target_id
      in: path
      required: true
      schema:
        type: string
    LibrarySource:
      name: source
      in: path
      required: true
      description: Any other value is a 404.
      schema:
        type: string
        enum: [sonarr, radarr]
    PageLimit:
      name: limit
      in: query
      required: false
      description: Page size, clamped to 1-200.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200

  schemas:
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
      required: [status]

    ConfigObject:
      type: object
      description: |
        Settings, in two shapes at once.

        `groups` is the data shaped for the React Settings screen, with the
        store and editability of each setting attached. Top-level flat keys are
        a deprecated compatibility shape retained through the cutover soak.

        Environment secrets are omitted entirely rather than redacted — there is
        nothing a reader could do with a redacted value they cannot change.
        Editable secrets come back as the literal string `<redacted>`, and
        sending that back means "unchanged".
      additionalProperties: true
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              settings:
                type: array
                items:
                  $ref: '#/components/schemas/SettingDescription'
        stores:
          type: object
          description: A label and an explanation for each store, for the UI to show.
          additionalProperties: true

    SettingDescription:
      type: object
      properties:
        key: { type: string }
        store:
          type: string
          enum: [env, db]
          description: >-
            `env` comes from dragoncp_env.env and is read-only at runtime.
            `db` is stored in app_settings and takes effect immediately.
        group: { type: string }
        label: { type: string }
        description: { type: string }
        kind:
          type: string
          enum: [text, password, number, boolean, path]
        editable:
          type: boolean
          description: True only for `db` settings. A write to any other key is refused by name.
        sensitive: { type: boolean }
        value: {}
        minimum: { type: integer }
        maximum: { type: integer }
        is_default:
          type: boolean
          description: >-
            `db` settings only. True when no row exists — a row holding an empty
            string is a deliberate choice, not an absence.

    ConfigSaveResult:
      type: object
      description: The full GET payload, plus what the write actually did.
      additionalProperties: true
      properties:
        status: { type: string }
        message: { type: string }
        saved:
          type: array
          items: { type: string }
          description: Keys that were written.
        refused:
          type: array
          items: { type: string }
          description: >-
            Keys that come from the environment file, or are not settings at all.
            Reported by name so a client can say what did not change.

    NotificationList:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        notifications:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
          description: >-
            The number of records returned. Only the paged listings report a
            figure independent of the page - see PagedNotificationList.

    PagedNotificationList:
      description: >-
        One page of the combined notification list. Rows carry `media_type`
        (`movie` for movie rows, the stored value for series rows) and
        `display_title`, so a caller need not know which table a row came from.
        Rows are whole table rows, so they also carry `sync_run_id` (the sync
        run the notification rides on; null for one stored before the sync
        engine) and `sync_attached_at`.
      allOf:
        - $ref: '#/components/schemas/NotificationList'
        - type: object
          properties:
            total:
              type: integer
              description: Records matching the filter across the whole table.
            count:
              type: integer
              description: Records on this page.
            limit:
              type: integer
            offset:
              type: integer
            status_counts:
              type: object
              additionalProperties:
                type: integer
              description: >-
                Matching records per status. Honours the search and set filters and
                ignores the single-status filter, so counts stay stable as filters
                change.
            unfiltered_total:
              type: integer
              description: Records ignoring the status filter and search.

    TransferList:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        transfers:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
          description: >-
            The number of records returned. Only the paged listings report a
            figure independent of the page - see PagedTransferList.

    PagedTransferList:
      description: One page of the transfer history.
      allOf:
        - $ref: '#/components/schemas/TransferList'
        - type: object
          properties:
            total:
              type: integer
              description: Records matching the filter across the whole table.
            count:
              type: integer
              description: Records on this page.
            limit:
              type: integer
            offset:
              type: integer
            status_counts:
              type: object
              additionalProperties:
                type: integer
              description: >-
                Matching records per status. Honours the search and set filters and
                ignores the single-status filter, so counts stay stable as filters
                change.
            unfiltered_total:
              type: integer
              description: Records ignoring the status filter and search.

    QueueStatus:
      type: object
      description: |
        Queue counters. `active_destinations` carries the transfer IDs that own
        reserved destinations, not the path strings.
      properties:
        max_concurrent:
          type: integer
        running_count:
          type: integer
        queued_count:
          type: integer
        available_slots:
          type: integer
        running_transfer_ids:
          type: array
          items:
            type: string
        queued_transfer_ids:
          type: array
          items:
            type: string
        active_destinations:
          type: array
          items:
            type: string

    DryRunResult:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        dry_run_result:
          type: object
          description: Simulated rsync outcome; api.md lists the fields.
          additionalProperties: true

    VerificationResult:
      type: object
      description: |
        Rename verification outcome. `result.status` is `verified`, `partial` or
        `failed`; the HTTP code reports whether the check ran, not whether it
        passed.
      properties:
        status:
          type: string
          enum: [success, error]
        result:
          type: object
          properties:
            notification_id:
              type: string
            series_title:
              type: string
            media_type:
              type: string
            status:
              type: string
              enum: [verified, partial, failed]
            total_files:
              type: integer
            verified_count:
              type: integer
            failed_count:
              type: integer
            verified_at:
              type: string
            message:
              type: string
            files:
              type: array
              items:
                type: object
                additionalProperties: true

    SyncRunSummary:
      type: object
      description: |
        One sync run as a list row. api.md section 13 describes every field.
        `stages` always holds the nine stages in order: receive, identify,
        batch, ready, safety, queue, transfer, finish, tell.
      additionalProperties: true
      properties:
        run_id: { type: string }
        kind:
          type: string
          enum: [sonarr_webhook, radarr_webhook, auto_scanner, manual, explore, restart, restore, simulation]
        kind_label: { type: string }
        label: { type: string }
        title: { type: string, nullable: true }
        season_name: { type: string, nullable: true }
        media_type: { type: string, nullable: true }
        source: { type: string, nullable: true }
        state:
          type: string
          enum: [held, waiting, checking, queued, transferring, paused, finishing,
                 completed, failed, cancelled, refused, interrupted]
        state_label: { type: string }
        current_stage: { type: string, nullable: true }
        current_summary:
          type: string
          nullable: true
          description: >-
            The sentence the stage named in `current_stage` last wrote - what a
            run still moving is doing now. Null when that stage has written
            nothing.
        outcome: { type: string, nullable: true }
        outcome_message: { type: string, nullable: true }
        transfer_id:
          type: string
          nullable: true
          description: Null until the run reaches the queue, where its transfer is created.
        parent_run_id: { type: string, nullable: true }
        parent_relation:
          type: string
          nullable: true
          description: "`follow_up` or `retry`"
        is_simulation: { type: boolean }
        requested_by:
          type: object
          properties:
            kind: { type: string, enum: [admin, automated, system] }
            name: { type: string }
            label: { type: string }
        stages:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              status:
                type: string
                enum: [pending, running, waiting, passed, skipped, failed, refused]
        webhook_count: { type: integer, nullable: true }
        next_check_at: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
        started_at: { type: string, nullable: true }
        finished_at: { type: string, nullable: true }

    SyncRunActionResult:
      type: object
      description: >-
        What the engine did with a request. Answered by the run actions and
        listed per run by the Library sync.
      properties:
        status:
          type: string
          enum: [success, error]
          description: Present on the run action endpoints only.
        ok: { type: boolean }
        run_id: { type: string, nullable: true }
        action:
          type: string
          enum: [opened, joined, follow_up, held, promoted, skipped, cancelled, failed]
        state: { type: string }
        message: { type: string }
        transfer_id: { type: string, nullable: true }
        queue_state:
          type: string
          nullable: true
          description: "`running`, `QUEUED_SLOT` or `QUEUED_PATH` when the queue was reached in the same request"

    Alert:
      type: object
      description: One alert on the Notifications page. api.md section 13 lists the kinds and actions.
      additionalProperties: true
      properties:
        alert_id: { type: string }
        kind:
          type: string
          enum: [restart_unfinished, transfer_unknown, stuck_download, ready_timeout,
                 sync_refused, transfer_failed, scanner_gap, missed_sync, integration_down,
                 job_failing, fast_route_failed]
        kind_label: { type: string }
        severity: { type: string }
        title: { type: string }
        message: { type: string, nullable: true }
        state: { type: string, enum: [open, done, wrong, dismissed] }
        run_id: { type: string, nullable: true }
        transfer_id: { type: string, nullable: true }
        unit_key: { type: string, nullable: true }
        link: { type: string, nullable: true }
        actions:
          type: array
          items:
            type: string
            enum: [sync_now, retry, sync_anyway, run_now, mark_done, mark_wrong, dismiss]
        action_buttons:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
        data: { type: object, additionalProperties: true }
        occurrences: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }
        resolved_at: { type: string, nullable: true }
        resolved_action: { type: string, nullable: true }
        resolved_by_kind: { type: string, nullable: true }
        resolved_by_name: { type: string, nullable: true }
        resolved_by_account_id: { type: integer, nullable: true }

    AlertSummary:
      type: object
      properties:
        status: { type: string }
        open: { type: integer }
        by_severity:
          type: object
          additionalProperties: { type: integer }

    SchedulerJob:
      type: object
      properties:
        name: { type: string }
        label: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        interval_seconds: { type: number, nullable: true }
        running: { type: boolean }
        last_run_at: { type: string, nullable: true }
        last_finished_at: { type: string, nullable: true }
        last_ok: { type: boolean, nullable: true }
        last_result:
          type: object
          additionalProperties: true
          description: What the last run returned, without any stack trace. `summary` is the sentence to show.
        consecutive_failures: { type: integer }
        next_run_at: { type: string, nullable: true }

    LibraryError:
      type: object
      description: The Media Library endpoints answer errors as `success` and `error`, not `status`.
      properties:
        success: { type: boolean, enum: [false] }
        error: { type: string }

  responses:
    Success:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ManualSyncStarted:
      description: The engine accepted the request; one run per folder
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [success] }
              message: { type: string }
              run_ids:
                type: array
                items: { type: string }
    ManualSyncRefused:
      description: >-
        Nothing could be synced - the notification does not exist, is already
        completed, rides on a run that is copying right now, or its folders could
        not be worked out. `message` says which.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:

  # ==================== AUTHENTICATION ====================

  /auth/login:
    post:
      tags: [Authentication]
      summary: Exchange username and password for an access token and a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required: [username, password]
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  token:
                    type: string
                  refresh_token:
                    type: string
                  expires_at:
                    type: string
                  refresh_expires_at:
                    type: string
                  user:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Backend authentication is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out the current user (client-side logout for a stateless JWT flow)
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/verify:
    get:
      tags: [Authentication]
      summary: Report whether the supplied access token is still valid
      security: []
      responses:
        '200':
          description: Always success; read `valid` for the answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  valid:
                    type: boolean
                  user:
                    type: string
                  remaining_seconds:
                    type: integer
                  message:
                    type: string

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange a valid refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required: [refresh_token]
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  token:
                    type: string
                  expires_at:
                    type: string
                  user:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/status:
    get:
      tags: [Authentication]
      summary: Report whether authentication is configured on this server
      security: []
      responses:
        '200':
          description: Auth configuration state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  auth_configured:
                    type: boolean
                  account_count:
                    type: integer
                  using_fallback_account:
                    type: boolean
                    description: >-
                      True while no enabled administrator exists in the database,
                      which is when the environment-file credentials are accepted.
                  message:
                    type: string

  /auth/me:
    get:
      tags: [Authentication]
      summary: Report who the caller is signed in as
      responses:
        '200':
          description: The caller's identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  user:
                    type: string
                  account_id:
                    type: integer
                    nullable: true
                    description: Stable identity; survives a username change. Null for the fallback account.
                  role:
                    type: string
                  must_change_password:
                    type: boolean
                  is_fallback_account:
                    type: boolean
                  can_change_password:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: >-
        Change your own password. There is no endpoint for changing anyone
        else's — that is scripts/manage_admins.py on the server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 10
      responses:
        '200':
          description: >-
            Password changed. Retires every token the account held, including the
            caller's, so a replacement token pair is returned for this browser to
            adopt. Every other session for the account is signed out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  token:
                    type: string
                  refresh_token:
                    type: string
                  expires_at:
                    type: string
                  refresh_expires_at:
                    type: string
                  user:
                    type: string
                  account_id:
                    type: integer
                    nullable: true
                  role:
                    type: string
                  must_change_password:
                    type: boolean
                  is_fallback_account:
                    type: boolean
        '400':
          description: >-
            Missing body, new password under 10 characters (WEAK_PASSWORD),
            unchanged from the current one (PASSWORD_UNCHANGED), or the caller is
            the environment-file fallback account (FALLBACK_ACCOUNT)
        '401':
          description: The current password is wrong, or there is no session

  # ==================== ACTIVITY ====================

  /activity:
    get:
      tags: [Activity]
      summary: >-
        Read the activity trail — who did what, and when — newest first.
        Read-only; nothing writes to or edits the trail through the API
      parameters:
        - { name: actor, in: query, schema: { type: string }, description: A username, or an automation name such as auto-sync }
        - { name: actor_kind, in: query, schema: { type: string, enum: [admin, automated, system] } }
        - { name: account_id, in: query, schema: { type: integer }, description: Stable account id; survives a rename }
        - { name: action, in: query, schema: { type: string }, description: One exact action (backup.restore), or several comma-separated meaning any of them (backup.delete,backup.retention_apply) }
        - { name: group, in: query, schema: { type: string }, description: An action family, e.g. backup }
        - { name: target_type, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [ok, failed, refused] } }
        - { name: since, in: query, schema: { type: string } }
        - { name: until, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of the trail, with the total behind it
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        occurred_at: { type: string }
                        actor_kind: { type: string, enum: [admin, automated, system] }
                        actor_name: { type: string }
                        actor_account_id: { type: integer, nullable: true }
                        action: { type: string }
                        target_type: { type: string, nullable: true }
                        target_id: { type: string, nullable: true }
                        target_label: { type: string, nullable: true }
                        summary: { type: string }
                        detail: { type: object, nullable: true }
                        outcome: { type: string, enum: [ok, failed, refused] }
                        request_ip: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /activity/for/{target_type}/{target_id}:
    get:
      tags: [Activity]
      summary: Everything recorded against one thing, oldest first
      parameters:
        - { name: target_type, in: path, required: true, schema: { type: string } }
        - { name: target_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /activity/filters:
    get:
      tags: [Activity]
      summary: >-
        What the activity screen can filter by. Actors come from the trail, so
        someone whose account was disabled still appears
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== CONFIGURATION AND SSH ====================

  /config:
    get:
      tags: [Configuration]
      summary: >-
        Return every setting grouped for React, plus a deprecated flat compatibility
        shape. Each grouped setting says which store owns it and whether it can be changed here
      responses:
        '200':
          description: Configuration object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Configuration]
      summary: >-
        Write the database-backed settings in the payload. Environment-owned keys are
        refused by name and listed in `refused`. The whole payload is validated before
        anything is written, so a 400 means nothing changed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigObject'
      responses:
        '200':
          description: >-
            Saved. Carries `saved` and `refused` key lists alongside the full GET payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSaveResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /config/reset:
    post:
      tags: [Configuration]
      summary: >-
        Deprecated cutover compatibility endpoint. There is no per-browser override
        layer left to clear, so this reports success and changes nothing
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /config/env-only:
    get:
      tags: [Configuration]
      summary: >-
        Deprecated cutover compatibility endpoint returning environment-backed settings
      responses:
        '200':
          description: Configuration object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigObject'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /connect:
    post:
      tags: [Configuration]
      summary: Open an SSH connection to the remote server and attach it to the runtime
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                username:
                  type: string
                password:
                  type: string
                key_path:
                  type: string
      responses:
        '200':
          description: |
            Connection attempted. A missing field or a failed connection is
            reported in the body as `status: error`, still with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Body was valid JSON but not an object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /disconnect:
    post:
      tags: [Configuration]
      summary: Close the current SSH connection and clear connection state
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auto-connect:
    get:
      tags: [Configuration]
      summary: Connect over SSH using the configured environment credentials
      responses:
        '200':
          description: |
            Connection attempted. Missing credentials or a failed connection are
            reported in the body as `status: error`, still with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ssh-config:
    get:
      tags: [Configuration]
      summary: Return the loaded SSH settings, with the password reduced to a boolean
      responses:
        '200':
          description: SSH settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  host:
                    type: string
                  username:
                    type: string
                  key_path:
                    type: string
                  has_password:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== MEDIA BROWSING ====================

  /media-types:
    get:
      tags: [Media Browsing]
      summary: List the three media types and their configured source paths
      responses:
        '200':
          description: Media type list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    path:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /media/dry-run:
    post:
      tags: [Media Browsing]
      summary: Preview an rsync for a chosen media folder without changing any file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                media_type:
                  type: string
                  enum: [movies, tvshows, anime]
                folder_name:
                  type: string
                season_name:
                  type: string
                  description: Optional; series and anime only.
              required: [media_type, folder_name]
      responses:
        '200':
          description: Dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== TRANSFERS ====================

  /transfer:
    post:
      tags: [Transfers]
      summary: Sync a named folder or file as a manual run through the sync engine
      description: >-
        The folder's batch, the safety dry run, then the queue. The transfer is
        created only once the safety check passes, so the answer carries the
        run to follow: `transfer_id` is null and `transfer_state` is the run's
        state (`checking` for a new run). When the engine cannot work out the
        folders the body is `status: error` with the `run_id` of the run
        recorded as failed, still with HTTP 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [folder, file]
                media_type:
                  type: string
                  enum: [movies, tvshows, anime]
                folder_name:
                  type: string
                season_name:
                  type: string
                episode_name:
                  type: string
                  description: >-
                    Required when type is `file`. Known defect: it is appended
                    to the destination too, so the file lands in a new folder
                    named after it; see api.md.
              required: [media_type, folder_name]
      responses:
        '200':
          description: Run opened or joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  transfer_id:
                    type: string
                    nullable: true
                    description: Null - no transfer exists yet when this returns.
                  run_id:
                    type: string
                  transfer_state:
                    type: string
                    description: >-
                      The run's state, not the queue's. Formerly `running`,
                      `QUEUED_SLOT` or `QUEUED_PATH`.
                  message:
                    type: string
                  source:
                    type: string
                  destination:
                    type: string
                  episode_name:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfer/{transfer_id}/status:
    get:
      tags: [Transfers]
      summary: Return one transfer with its progress and log summary
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Transfer object
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  transfer:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfer/{transfer_id}/logs:
    get:
      tags: [Transfers]
      summary: Return the full stored log lines for one transfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Log lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  logs:
                    type: array
                    items:
                      type: string
                  log_count:
                    type: integer
                  transfer_status:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfer/{transfer_id}/cancel:
    post:
      tags: [Transfers]
      summary: Cancel a transfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: |
            Cancellation attempted. A failure is reported in the body as
            `status: error`, still with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfer/{transfer_id}/pause:
    post:
      tags: [Transfers]
      summary: Stop a running transfer but keep its partial files and free its queue slot
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          description: Only a running transfer can be paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /transfer/{transfer_id}/resume:
    post:
      tags: [Transfers]
      summary: Resume a paused transfer from its partial files, re-queueing it if no slot is free
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: |
            Resumed, or queued because no slot was free - the message says
            which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Not paused, or another transfer now owns the destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /transfer/{transfer_id}/restart:
    post:
      tags: [Transfers]
      summary: Retry a failed, cancelled or completed transfer as a restart run through the sync engine
      description: >-
        The safety check runs first, then the queue; the transfer keeps its id.
        The dry run is skipped, with the reason on the run, for a simulation's
        transfer, a single file, or an Explore plan's transfer. If a sync for
        the same folder is open and not yet copying, the restart joins it
        instead. A refusal after the run opens is recorded on the run, not in
        this response. Refusals here (`Transfer not found`, a transfer in any
        other status, a restore, which is run again from the Backups page) are
        reported as `status: error` with HTTP 200.
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Run opened or joined, or a refusal in the body
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success, error] }
                  message: { type: string }
                  run_id: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfer/{transfer_id}/delete:
    post:
      tags: [Transfers]
      summary: Delete a transfer record; a running transfer must be cancelled first
      description: >-
        A queued or paused transfer is cancelled before its row is deleted, so
        its queue reservation is freed and its sync run closes as cancelled. A
        pending one cannot be cancelled and is deleted as it is.
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: |
            Deletion attempted. A refusal, such as a still-running transfer, is
            reported in the body as `status: error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfers/all:
    get:
      tags: [Transfers]
      summary: List one page of transfer history, filtered, searched and paged in SQL
      parameters:
        - $ref: '#/components/parameters/Limit50'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/StatusesFilter'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: >-
            Transfer list; carries `log_count` but never the log bodies. Each row
            also carries `started_by_kind`, `started_by_name`,
            `started_by_account_id`, `transport`, `queue_reason` and
            `sync_run_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTransferList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfers/bulk-delete:
    post:
      tags: [Transfers]
      summary: Delete several transfer records, by id or by re-running a filter
      description: >-
        With `all_matching`, the filter is re-evaluated on the server rather
        than trusting a list of ids, so "select all" means every match and not
        only the rows a client had loaded; `ids` is then ignored. Transfers that
        are still running are never deleted and come back in `skipped`. Queued
        and paused ones are cancelled first, as for a single delete.
        Deleting completed records also removes the sync history Browse Media
        reads, so the media they copied will show as not yet synced.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                all_matching:
                  type: boolean
                status:
                  type: string
                statuses:
                  type: array
                  items:
                    type: string
                search:
                  type: string
      responses:
        '200':
          description: How many records were deleted, and which were left alone
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  deleted_count:
                    type: integer
                  skipped:
                    type: array
                    items:
                      type: string
                    description: Ids of transfers left alone because they are still running.
                  message:
                    type: string
        '400':
          description: '`ids` was present but not a list'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Deletion failed

  /transfers/active:
    get:
      tags: [Transfers]
      summary: List currently active transfers together with queue state
      responses:
        '200':
          description: >-
            Active transfers and queue counters. Each row carries the
            `/transfers/all` fields bar `end_time`, plus `rsync_process_id`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TransferList'
                  - type: object
                    properties:
                      queue_status:
                        $ref: '#/components/schemas/QueueStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfers/queue/status:
    get:
      tags: [Transfers]
      summary: Return queue counters only
      responses:
        '200':
          description: Queue counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  queue:
                    $ref: '#/components/schemas/QueueStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /transfers/cleanup:
    post:
      tags: [Transfers]
      summary: Remove duplicate transfer records per destination, keeping the latest successful one
      responses:
        '200':
          description: Cleanup summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  cleaned_count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== WEBHOOK RECEIVERS ====================

  /webhook/movies:
    post:
      tags: [Webhooks - Receivers]
      summary: Receive a Radarr movie webhook, store it, and hand it to the sync engine as a radarr_webhook run
      description: |
        Test payloads are detected and answered with a test success without
        creating a notification. Every stored notification joins or opens a
        run; with auto-sync off the run is opened `held` for a person.
      security:
        - webhookSignature: []
        - {}
      requestBody:
        required: true
        description: Radarr payload.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Notification stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success, warning]
                    description: "`warning` when auto-sync is on and the engine refused the request"
                  message:
                    type: string
                  notification_id:
                    type: string
                  auto_sync:
                    type: boolean
                    description: Auto-sync was on and the engine accepted the request.
                  run_id:
                    type: string
                    description: The sync run the notification joined or opened.
        '401':
          description: Missing or invalid X-DragonCP-Signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Source IP not in WEBHOOK_ALLOWED_IPS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /webhook/series:
    post:
      tags: [Webhooks - Receivers]
      summary: Receive a Sonarr TV webhook; a Rename event runs the local rename replay instead of a sync
      description: |
        An import is stored and handed to the sync engine as a `sonarr_webhook`
        run, which waits in the ready check before the safety check and the
        queue; with auto-sync off the run is opened `held`. The answer carries
        `status` (`success`, or `warning` when the engine refused it),
        `message`, `notification_id`, `auto_sync` and the `run_id` it joined or
        opened.
      security:
        - webhookSignature: []
        - {}
      requestBody:
        required: true
        description: Sonarr payload.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Notification stored, or rename replay reported as successful
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Rename replay reported failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid X-DragonCP-Signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Source IP not in WEBHOOK_ALLOWED_IPS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /webhook/anime:
    post:
      tags: [Webhooks - Receivers]
      summary: Receive a Sonarr anime webhook; same handling as the series receiver with media type anime
      description: Same answer as the series receiver, `run_id` included.
      security:
        - webhookSignature: []
        - {}
      requestBody:
        required: true
        description: Sonarr payload.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Notification stored, or rename replay reported as successful
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Rename replay reported failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid X-DragonCP-Signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Source IP not in WEBHOOK_ALLOWED_IPS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== WEBHOOK NOTIFICATION MANAGEMENT ====================

  /webhook/notifications:
    get:
      tags: [Webhooks - Management]
      summary: List one page of movie, series and anime notifications, newest first
      description: >-
        Ordering, paging and counting run across both notification tables in one
        query, so a page is the newest records overall and `total` is the real
        number of matches.
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/MediaTypeFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Limit50'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedNotificationList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /webhook/notifications/bulk-delete:
    post:
      tags: [Webhooks - Management]
      summary: Delete several notifications, by id or by re-running a filter
      description: >-
        Notification ids are unique across both tables, so a delete by id finds
        the owning table without the caller tracking the source. With
        `all_matching` the filter is re-evaluated here and `ids` is ignored.
        Media already copied and the transfers that copied it are not touched.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                all_matching:
                  type: boolean
                status:
                  type: string
                media_type:
                  type: string
                search:
                  type: string
      responses:
        '200':
          description: How many notifications were deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  deleted_count:
                    type: integer
                  message:
                    type: string
        '400':
          description: '`ids` was present but not a list'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Deletion failed

  /webhook/series/notifications:
    get:
      tags: [Webhooks - Management]
      summary: List TV series notifications only
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /webhook/anime/notifications:
    get:
      tags: [Webhooks - Management]
      summary: List anime notifications only
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /webhook/notifications/{notification_id}:
    get:
      tags: [Webhooks - Management]
      summary: Return one notification, looking in movies first and then series and anime
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Notification
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  notification:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhook/notifications/{notification_id}/json:
    get:
      tags: [Webhooks - Management]
      summary: Serve the raw stored webhook payload for one notification
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Raw payload, not wrapped in a status envelope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Notification or raw payload not available
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /webhook/notifications/{notification_id}/sync:
    post:
      tags: [Webhooks - Management]
      summary: Sync a movie notification by hand, as a manual run through the sync engine
      description: >-
        The id is looked up in both notification tables, so this and the series
        and anime variants accept any notification id. A run for the folder that
        has not started copying is joined (and told to go now if it is waiting);
        a folder being copied gets a follow-up run.
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          $ref: '#/components/responses/ManualSyncStarted'
        '400':
          $ref: '#/components/responses/ManualSyncRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /webhook/series/notifications/{notification_id}/sync:
    post:
      tags: [Webhooks - Management]
      summary: Sync a series notification by hand, as a manual run through the sync engine
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          $ref: '#/components/responses/ManualSyncStarted'
        '400':
          $ref: '#/components/responses/ManualSyncRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /webhook/anime/notifications/{notification_id}/sync:
    post:
      tags: [Webhooks - Management]
      summary: Sync an anime notification by hand, as a manual run through the sync engine
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          $ref: '#/components/responses/ManualSyncStarted'
        '400':
          $ref: '#/components/responses/ManualSyncRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /webhook/notifications/{notification_id}/complete:
    post:
      tags: [Webhooks - Management]
      summary: Mark a movie notification as completed by hand
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhook/series/notifications/{notification_id}/complete:
    post:
      tags: [Webhooks - Management]
      summary: Mark a series notification as completed by hand
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhook/anime/notifications/{notification_id}/complete:
    post:
      tags: [Webhooks - Management]
      summary: Mark an anime notification as completed by hand
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhook/notifications/{notification_id}/delete:
    post:
      tags: [Webhooks - Management]
      summary: Delete a movie notification record
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /webhook/series/notifications/{notification_id}/delete:
    post:
      tags: [Webhooks - Management]
      summary: Delete a series notification record
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /webhook/anime/notifications/{notification_id}/delete:
    post:
      tags: [Webhooks - Management]
      summary: Delete an anime notification record
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /webhook/notifications/{notification_id}/dry-run:
    post:
      tags: [Webhooks - Management]
      summary: Preview the rsync for a movie notification without changing any file
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhook/series/notifications/{notification_id}/dry-run:
    post:
      tags: [Webhooks - Management]
      summary: Preview the rsync for a series notification without changing any file
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhook/anime/notifications/{notification_id}/dry-run:
    post:
      tags: [Webhooks - Management]
      summary: Preview the rsync for an anime notification; delegates to the series handler
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== RENAME NOTIFICATIONS ====================

  /webhook/rename/notifications:
    get:
      tags: [Webhooks - Renames]
      summary: List rename runs, optionally filtered by status and media type
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - name: media_type
          in: query
          required: false
          schema:
            type: string
            enum: [tvshows, anime]
        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          description: Rename notification list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /webhook/rename/notifications/{notification_id}:
    get:
      tags: [Webhooks - Renames]
      summary: Return one rename run with its per-file records
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Rename notification
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  notification:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /webhook/rename/notifications/{notification_id}/json:
    get:
      tags: [Webhooks - Renames]
      summary: Serve the raw stored rename payload
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Raw payload, not wrapped in a status envelope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Notification or raw payload not available
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /webhook/rename/notifications/{notification_id}/delete:
    post:
      tags: [Webhooks - Renames]
      summary: Remove one rename run from history
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /webhook/rename/notifications/{notification_id}/verify:
    post:
      tags: [Webhooks - Renames]
      summary: Check whether the files from one rename run are on disk under their new names
      description: |
        Read-only: nothing is renamed and the outcome is not written back to the
        history row. HTTP 200 means the check ran, not that it passed - read
        `result.status` (`verified`, `partial` or `failed`) for the outcome.
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Check ran; the outcome may be verified, partial or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResult'
        '400':
          description: Nothing to verify - no file records and no usable stored payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==================== WEBHOOK SETTINGS ====================

  /webhook/settings:
    get:
      tags: [Webhooks - Settings]
      summary: Return the auto-sync settings
      responses:
        '200':
          description: Auto-sync settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  settings:
                    type: object
                    properties:
                      auto_sync_movies:
                        type: boolean
                      auto_sync_series:
                        type: boolean
                      auto_sync_anime:
                        type: boolean
                      series_anime_sync_wait_time:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Webhooks - Settings]
      summary: Update the auto-sync settings; the wait time is clamped to 30-900 seconds
      description: >-
        The `auto_sync_*` switches decide whether a webhook's run starts by
        itself or is opened `held` for a person. `series_anime_sync_wait_time`
        is the sync engine's fallback timer, used only when Sonarr cannot be
        asked whether a season is still downloading.
      requestBody:
        required: true
        description: Any subset of the four settings.
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_sync_movies:
                  type: boolean
                auto_sync_series:
                  type: boolean
                auto_sync_anime:
                  type: boolean
                series_anime_sync_wait_time:
                  type: integer
                  minimum: 30
                  maximum: 900
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== CONNECTORS ====================
  #
  # /discord/settings and /discord/test were removed; Discord is a connector.
  # No response from these endpoints ever contains a credential: secrets come
  # back only as `secrets_set` booleans, and `<redacted>` sent on save means
  # "unchanged".

  /connectors:
    get:
      tags: [Connectors]
      summary: Every connector this build knows about, configured or not
      responses:
        '200':
          description: Connector list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  connectors:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /connectors/events:
    get:
      tags: [Connectors]
      summary: The notification catalogue and where each announcement currently goes
      responses:
        '200':
          description: Every event, routed or not, and the notifying connectors with their destinations
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  connectors:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /connectors/routes:
    put:
      tags: [Connectors]
      summary: Save the routing table; a null target_id means "use the connector's default"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [routes]
              properties:
                routes:
                  type: array
                  items:
                    type: object
                    properties:
                      event_key: { type: string }
                      connector_id: { type: string }
                      target_id: { type: string, nullable: true }
                      enabled: { type: boolean, default: true }
      responses:
        '200':
          description: How many rows were saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  saved: { type: integer }
        '400':
          description: >-
            Not a list, an unknown event or connector, or a destination that
            does not belong to the connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /connectors/{connector_id}:
    get:
      tags: [Connectors]
      summary: One connector, plus its stored routes
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
      responses:
        '200':
          description: The connector
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  connector:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Connectors]
      summary: Save a connector's settings; secret fields are stored apart and never returned
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Omit to leave it alone.
                config:
                  type: object
                  additionalProperties: true
                  description: >-
                    Any subset of the connector's fields. A secret sent as
                    `<redacted>` is not written; a secret sent as "" is deleted.
      responses:
        '200':
          description: Saved; the connector as it now stands
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  connector:
                    type: object
                    additionalProperties: true
        '400':
          description: "`config` is not an object, or names a key the connector does not declare"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /connectors/{connector_id}/check:
    post:
      tags: [Connectors]
      summary: Reach the service now and report what happened; the result is stored on the connector
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
      responses:
        '200':
          description: Check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  result:
                    type: object
                    properties:
                      ok: { type: boolean }
                      message: { type: string }
                      detail: { type: object, additionalProperties: true }
        '400':
          description: The connector declares supports_check false (Discord); test a destination instead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /connectors/{connector_id}/targets:
    post:
      tags: [Connectors]
      summary: Add a destination to a notifying connector; the first one becomes the default
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, credential]
              properties:
                label: { type: string, maxLength: 60 }
                credential:
                  type: string
                  description: Validated by the connector, e.g. a Discord webhook URL.
                make_default: { type: boolean }
      responses:
        '200':
          description: The new destination's id and the connector's destinations
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  target_id: { type: string }
                  targets:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          description: >-
            Not a notifying connector, a missing, too long or duplicate label,
            or a credential the connector rejects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /connectors/{connector_id}/targets/{target_id}:
    patch:
      tags: [Connectors]
      summary: Rename a destination, replace its credential, take it in or out of service, or make it the default
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/TargetId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 60 }
                credential:
                  type: string
                  description: "`<redacted>` means unchanged."
                enabled: { type: boolean }
                make_default: { type: boolean }
      responses:
        '200':
          description: The connector's destinations
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  targets:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          description: Not a notifying connector, an invalid label, or a credential the connector rejects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown connector, or the destination no longer exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Connectors]
      summary: Remove a destination and its credential; routes pointing at it fall back to the default
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/TargetId'
      responses:
        '200':
          description: The connector's remaining destinations
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  targets:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          description: Not a notifying connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown connector, or the destination no longer exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /connectors/{connector_id}/targets/{target_id}/test:
    post:
      tags: [Connectors]
      summary: Send a real test message to one destination now, ignoring routing
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/TargetId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          description: Not a notifying connector, or the service refused the message (its explanation, redacted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown connector, or the destination no longer exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /connectors/{connector_id}/deliveries:
    get:
      tags: [Connectors]
      summary: Recent announcements this connector handled, newest first, with what happened to each
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: Delivery history
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  deliveries:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== BACKUPS ====================
  #
  # Backups are organised by SLOT — one movie, or one episode — with a version
  # history inside each. A CAPTURE is one stored version. See
  # ../features/backups/README.md.

  /backups/overview:
    get:
      tags: [Backups]
      summary: Totals, backup-disk pressure, the retention rule and pending migration work
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  configured:
                    type: boolean
                    description: >-
                      False when BACKUP_PATH is unset, in which case transfers
                      refuse to start — there is nowhere safe to put displaced
                      files, and there is deliberately no fallback.
                  totals: { type: object }
                  disk: { type: object, nullable: true }
                  retention: { type: object }
                  libraries: { type: array, items: { type: object } }
                  legacy_folders: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/titles:
    get:
      tags: [Backups]
      summary: Titles holding stored versions
      parameters:
        - name: library
          in: query
          required: false
          schema:
            type: string
            enum: [movies, shows, anime]
      responses:
        '200':
          description: Titles
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/seasons:
    get:
      tags: [Backups]
      summary: Seasons within one title
      parameters:
        - name: library
          in: query
          required: true
          schema:
            type: string
        - name: title
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Seasons
        '400':
          description: library and title are both required
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/slots:
    get:
      tags: [Backups]
      summary: One row per movie or episode with stored versions
      parameters:
        - name: library
          in: query
          required: false
          schema:
            type: string
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: season
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: sort
          in: query
          required: false
          description: >-
            'size' puts the biggest first, which is the order you want when the
            question is what to delete to get space back.
          schema:
            type: string
            enum: [recent, size]
            default: recent
      responses:
        '200':
          description: Slot list with version counts and sizes
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/slot:
    get:
      tags: [Backups]
      summary: One slot's versions, newest first, and what the library holds now
      parameters:
        - name: slot_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Version history plus the current occupant
        '400':
          description: slot_key is required
        '404':
          description: No versions stored for this slot
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/captures/{capture_id}:
    get:
      tags: [Backups]
      summary: One stored version, with its files and the slots it belongs to
      parameters:
        - name: capture_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The version
        '404':
          description: Not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/unsorted:
    get:
      tags: [Backups]
      summary: Files kept but not identified; listed, never restorable
      responses:
        '200':
          description: Unidentified captures
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/captures/{capture_id}/plan:
    post:
      tags: [Backups]
      summary: Preview a restore. Reads only; the same planner runs it
      parameters:
        - name: capture_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string }
                  description: >-
                    Paths inside the capture. Omit the key entirely to mean
                    every file. An EMPTY LIST is rejected — ticking nothing is
                    not a request to restore everything.
      responses:
        '200':
          description: >-
            The plan. Each operation carries the target path and `replaces`,
            which is null when the slot is empty. `blocked` is set with a reason
            when the restore cannot run at all.
        '400':
          description: Empty selection, or a path that failed traversal checks
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/captures/{capture_id}/restore:
    post:
      tags: [Backups]
      summary: Start a restore
      description: >-
        Returns as soon as the run is accepted; it proceeds as a queued transfer
        with progress and logs. The file each restored file replaces is stored as
        a new version of the same slot FIRST, so a restore can itself be undone.
        Refuses rather than queueing silently when the destination is busy, when
        every transfer slot is taken, or when the same version is already being
        restored.
      parameters:
        - name: capture_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Accepted; includes the transfer id
        '400':
          description: Blocked, refused, or an invalid selection
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/captures/{capture_id}/pin:
    post:
      tags: [Backups]
      summary: Pin or unpin a version. Pinned versions are never removed by retention
      parameters:
        - name: capture_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pinned: { type: boolean, default: true }
      responses:
        '200':
          description: Updated
        '404':
          description: Not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/captures/{capture_id}/delete:
    post:
      tags: [Backups]
      summary: >-
        Remove a version's files and its index entry, always together. The library is
        not touched
      description: >-
        There is no record-only option. The index is derived from the backup tree, so
        removing a row on its own frees no space and the entry returns at the next
        rebuild. Any `delete_files` or `delete_record` flag in the body is ignored.
      parameters:
        - name: capture_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
        '400':
          description: Not found, or the files could not be removed
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/delete/preview:
    post:
      tags: [Backups]
      summary: Preview a deletion — what it removes and the space it frees. Reads only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of capture_ids or slot_keys is required.
              properties:
                capture_ids: { type: array, items: { type: string } }
                slot_keys: { type: array, items: { type: string } }
                keep_newest:
                  type: integer
                  description: With slot_keys, leave the most recent N of each.
                include_pinned: { type: boolean, default: false }
      responses:
        '200':
          description: Candidates, count, total size and how many pins were held back
        '400':
          description: Nothing was selected
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/delete:
    post:
      tags: [Backups]
      summary: Remove several versions at once — the space-reclaiming action
      description: >-
        Pinned versions are held back unless include_pinned is set, and the
        number held back is reported. Removes the files and the index entry
        together, prunes the folders it emptied, and never touches the library.
        This has no undo — those files are the last copy of that version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                capture_ids: { type: array, items: { type: string } }
                slot_keys: { type: array, items: { type: string } }
                keep_newest: { type: integer }
                include_pinned: { type: boolean, default: false }
      responses:
        '200':
          description: What was deleted and how much was reclaimed
        '400':
          description: Nothing was selected
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/unsorted/delete:
    post:
      tags: [Backups]
      summary: Throw away everything that could not be identified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean }
      responses:
        '200':
          description: What was removed
        '400':
          description: Not confirmed
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/rebuild:
    post:
      tags: [Backups]
      summary: Regenerate the index by walking the backup tree
      description: >-
        The tree is the source of truth; this index is a view over it. Writes no
        files and deletes no media, and is idempotent. Pins, displacement reasons
        and transfer provenance are carried forward, because a path cannot hold
        them.
      responses:
        '200':
          description: Counts of what was indexed and what stale entries went
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/retention:
    get:
      tags: [Backups]
      summary: The retention rule and backup-disk usage
      responses:
        '200':
          description: >-
            Rule and disk usage. `retention.editable` is false when there is no
            database store, in which case the rule is env-file only.
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Backups]
      summary: Save the retention rule
      description: >-
        Written to the app_settings table, not the env file — the only store
        that both survives a restart and is visible to the background thread
        that applies the rule after a transfer.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keep: { type: integer, minimum: 1, maximum: 50 }
                grace_hours: { type: integer, minimum: 0 }
                enabled: { type: boolean }
      responses:
        '200':
          description: The saved rule
        '400':
          description: Invalid value, or no settings store is available
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/retention/preview:
    post:
      tags: [Backups]
      summary: Which versions keep-N would remove. Reads only
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keep: { type: integer }
                grace_hours: { type: integer }
      responses:
        '200':
          description: Candidates and the space they hold
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/retention/apply:
    post:
      tags: [Backups]
      summary: Remove them, reporting what went and how much was reclaimed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keep: { type: integer }
                grace_hours: { type: integer }
      responses:
        '200':
          description: What was deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/migration/plan:
    post:
      tags: [Backups]
      summary: Preview adopting the old per-transfer folders. Moves nothing
      responses:
        '200':
          description: >-
            Planned moves, unidentified files and empty folders. `blocked` is set
            when a transfer is still running, because migration moves files
            across the whole backup disk.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/migration/apply:
    post:
      tags: [Backups]
      summary: Carry out the migration and rebuild the index over the result
      description: >-
        Re-walks the disk and derives its own plan rather than redeeming the one
        `/migration/plan` returned, so a folder that appeared or changed since
        the preview is handled as it is now. Safe here in a way it would not be
        for a deletion: migration only moves legacy folders into the tree and
        removes ones it has emptied, so a drifted plan costs accuracy, not files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean }
      responses:
        '200':
          description: What moved and what was removed
        '400':
          description: Not confirmed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            Refused. A transfer is active, or whether one is active could not be
            determined. The body carries `applied: false` and the reason in
            `message`.

  # ---- Deprecated backup compatibility endpoints -------------------------
