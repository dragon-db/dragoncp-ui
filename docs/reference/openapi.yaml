      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - name: media_type
          in: query
          required: false
          schema:
            type: string
            enum: [tvshows, anime]
        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          description: Rename notification list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /webhook/rename/notifications/{notification_id}:
    get:
      tags: [Webhooks - Renames]
      summary: Return one rename run with its per-file records
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Rename notification
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  notification:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /webhook/rename/notifications/{notification_id}/json:
    get:
      tags: [Webhooks - Renames]
      summary: Serve the raw stored rename payload
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Raw payload, not wrapped in a status envelope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Notification or raw payload not available
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /webhook/rename/notifications/{notification_id}/delete:
    post:
      tags: [Webhooks - Renames]
      summary: Remove one rename run from history
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /webhook/rename/notifications/{notification_id}/verify:
    post:
      tags: [Webhooks - Renames]
      summary: Check whether the files from one rename run are on disk under their new names
      description: |
        Read-only: nothing is renamed and the outcome is not written back to the
        history row. HTTP 200 means the check ran, not that it passed - read
        `result.status` (`verified`, `partial` or `failed`) for the outcome.
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Check ran; the outcome may be verified, partial or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResult'
        '400':
          description: Nothing to verify - no file records and no usable stored payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==================== WEBHOOK AND DISCORD SETTINGS ====================

  /webhook/settings:
    get:
      tags: [Webhooks - Settings]
      summary: Return the auto-sync settings
      responses:
        '200':
          description: Auto-sync settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  settings:
                    type: object
                    properties:
                      auto_sync_movies:
                        type: boolean
                      auto_sync_series:
                        type: boolean
                      auto_sync_anime:
                        type: boolean
                      series_anime_sync_wait_time:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Webhooks - Settings]
      summary: Update the auto-sync settings; the wait time is clamped to 30-900 seconds
      requestBody:
        required: true
        description: Any subset of the four settings.
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_sync_movies:
                  type: boolean
                auto_sync_series:
                  type: boolean
                auto_sync_anime:
                  type: boolean
                series_anime_sync_wait_time:
                  type: integer
                  minimum: 30
                  maximum: 900
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /discord/settings:
    get:
      tags: [Webhooks - Settings]
      summary: Return the Discord notification settings
      responses:
        '200':
          description: Discord settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  settings:
                    type: object
                    properties:
                      webhook_url:
                        type: string
                      app_url:
                        type: string
                      manual_sync_thumbnail_url:
                        type: string
                      icon_url:
                        type: string
                      enabled:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Webhooks - Settings]
      summary: Update the Discord notification settings
      requestBody:
        required: true
        description: Any subset of the five settings.
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                webhook_url:
                  type: string
                app_url:
                  type: string
                manual_sync_thumbnail_url:
                  type: string
                icon_url:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
