      responses:
        '200':
          description: Notification stored, or rename replay reported as successful
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Rename replay reported failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid X-DragonCP-Signature
          content:
            application/json:
