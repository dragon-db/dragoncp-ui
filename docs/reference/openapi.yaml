      summary: Receive a Radarr movie webhook, store it, and auto-sync when enabled
      description: |
        Test payloads are detected and answered with a test success without
        creating a notification.
      security:
        - webhookSignature: []
        - {}
      requestBody:
        required: true
        description: Radarr payload.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Notification stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  notification_id:
                    type: string
                  auto_sync:
                    type: boolean
        '401':
          description: Missing or invalid X-DragonCP-Signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Source IP not in WEBHOOK_ALLOWED_IPS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /webhook/series:
