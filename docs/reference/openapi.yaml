          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== BACKUPS ====================

  /backups:
    get:
      tags: [Backups]
      summary: List backup records
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: include_deleted
          in: query
          required: false
          description: Pass `1`, `true` or `True` to include deleted records.
          schema:
            type: string
      responses:
        '200':
          description: Backup list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  backups:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/{backup_id}:
    get:
      tags: [Backups]
      summary: Return one backup record
      parameters:
        - $ref: '#/components/parameters/BackupId'
      responses:
        '200':
          description: Backup record
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  backup:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /backups/{backup_id}/files:
    get:
      tags: [Backups]
      summary: List the files held in one backup
      parameters:
        - $ref: '#/components/parameters/BackupId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  files:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/{backup_id}/restore:
    post:
      tags: [Backups]
      summary: Restore a backup in full, or only the listed relative file paths
      parameters:
        - $ref: '#/components/parameters/BackupId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  description: Relative paths to restore; omit for a full restore.
                  items:
                    type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          description: Invalid `files` shape, or the restore failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/{backup_id}/delete:
    post:
      tags: [Backups]
      summary: Delete a backup record and optionally its files on disk
      parameters:
        - $ref: '#/components/parameters/BackupId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                delete_record:
                  type: boolean
                delete_files:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/{backup_id}/plan:
    post:
      tags: [Backups]
      summary: Preview what a restore would copy back, without applying it
      parameters:
        - $ref: '#/components/parameters/BackupId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Restore plan, one entry per file that would be copied back
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  plan:
                    type: object
                    properties:
                      operations:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/reindex:
    post:
      tags: [Backups]
      summary: Scan the backup directory and import folders that are missing from the database
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  imported:
                    type: integer
                  skipped:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

