      description: |
        Read-only: nothing is renamed and the outcome is not written back to the
        history row. HTTP 200 means the check ran, not that it passed - read
        `result.status` (`verified`, `partial` or `failed`) for the outcome.
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Check ran; the outcome may be verified, partial or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResult'
        '400':
          description: Nothing to verify - no file records and no usable stored payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==================== WEBHOOK AND DISCORD SETTINGS ====================

  /webhook/settings:
    get:
      tags: [Webhooks - Settings]
      summary: Return the auto-sync settings
      responses:
        '200':
          description: Auto-sync settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  settings:
                    type: object
                    properties:
                      auto_sync_movies:
                        type: boolean
                      auto_sync_series:
                        type: boolean
                      auto_sync_anime:
                        type: boolean
                      series_anime_sync_wait_time:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Webhooks - Settings]
      summary: Update the auto-sync settings; the wait time is clamped to 30-900 seconds
      requestBody:
        required: true
        description: Any subset of the four settings.
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_sync_movies:
                  type: boolean
                auto_sync_series:
                  type: boolean
                auto_sync_anime:
                  type: boolean
                series_anime_sync_wait_time:
                  type: integer
                  minimum: 30
                  maximum: 900
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /discord/settings:
    get:
      tags: [Webhooks - Settings]
      summary: Return the Discord notification settings
      responses:
        '200':
          description: Discord settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  settings:
                    type: object
                    properties:
                      webhook_url:
                        type: string
                      app_url:
                        type: string
                      manual_sync_thumbnail_url:
                        type: string
                      icon_url:
                        type: string
                      enabled:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Webhooks - Settings]
      summary: Update the Discord notification settings
      requestBody:
        required: true
        description: Any subset of the five settings.
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                webhook_url:
                  type: string
                app_url:
                  type: string
                manual_sync_thumbnail_url:
                  type: string
                icon_url:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /discord/test:
    post:
      tags: [Webhooks - Settings]
      summary: Send a test embed to the configured Discord webhook
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          description: Discord notifications disabled, or the webhook URL is missing, invalid or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== BACKUPS ====================
  #
  # Backups are organised by SLOT — one movie, or one episode — with a version
  # history inside each. A CAPTURE is one stored version. See
  # ../features/backups/README.md.

  /backups/overview:
    get:
      tags: [Backups]
      summary: Totals, backup-disk pressure, the retention rule and pending migration work
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  configured:
                    type: boolean
                    description: >-
                      False when BACKUP_PATH is unset, in which case transfers
                      refuse to start — there is nowhere safe to put displaced
                      files, and there is deliberately no fallback.
                  totals: { type: object }
                  disk: { type: object, nullable: true }
                  retention: { type: object }
                  libraries: { type: array, items: { type: object } }
                  legacy_folders: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/titles:
    get:
      tags: [Backups]
      summary: Titles holding stored versions
      parameters:
        - name: library
          in: query
          required: false
          schema:
            type: string
            enum: [movies, shows, anime]
      responses:
        '200':
          description: Titles
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/seasons:
    get:
      tags: [Backups]
      summary: Seasons within one title
      parameters:
        - name: library
          in: query
          required: true
          schema:
            type: string
        - name: title
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Seasons
        '400':
          description: library and title are both required
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/slots:
    get:
      tags: [Backups]
      summary: One row per movie or episode with stored versions
      parameters:
        - name: library
          in: query
          required: false
          schema:
            type: string
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: season
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: sort
          in: query
          required: false
          description: >-
            'size' puts the biggest first, which is the order you want when the
            question is what to delete to get space back.
          schema:
            type: string
            enum: [recent, size]
            default: recent
      responses:
        '200':
          description: Slot list with version counts and sizes
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/slot:
    get:
      tags: [Backups]
      summary: One slot's versions, newest first, and what the library holds now
      parameters:
        - name: slot_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Version history plus the current occupant
        '400':
          description: slot_key is required
        '404':
          description: No versions stored for this slot
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/captures/{capture_id}:
    get:
      tags: [Backups]
      summary: One stored version, with its files and the slots it belongs to
      parameters:
        - name: capture_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The version
        '404':
          description: Not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/unsorted:
    get:
      tags: [Backups]
      summary: Files kept but not identified; listed, never restorable
      responses:
        '200':
          description: Unidentified captures
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/captures/{capture_id}/plan:
    post:
      tags: [Backups]
      summary: Preview a restore. Reads only; the same planner runs it
      parameters:
        - name: capture_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string }
                  description: >-
                    Paths inside the capture. Omit the key entirely to mean
                    every file. An EMPTY LIST is rejected — ticking nothing is
                    not a request to restore everything.
      responses:
        '200':
          description: >-
            The plan. Each operation carries the target path and `replaces`,
            which is null when the slot is empty. `blocked` is set with a reason
            when the restore cannot run at all.
        '400':
          description: Empty selection, or a path that failed traversal checks
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/captures/{capture_id}/restore:
    post:
      tags: [Backups]
      summary: Start a restore
      description: >-
        Returns as soon as the run is accepted; it proceeds as a queued transfer
        with progress and logs. The file each restored file replaces is stored as
        a new version of the same slot FIRST, so a restore can itself be undone.
        Refuses rather than queueing silently when the destination is busy, when
        every transfer slot is taken, or when the same version is already being
        restored.
      parameters:
        - name: capture_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Accepted; includes the transfer id
        '400':
          description: Blocked, refused, or an invalid selection
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/captures/{capture_id}/pin:
    post:
      tags: [Backups]
      summary: Pin or unpin a version. Pinned versions are never removed by retention
      parameters:
        - name: capture_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pinned: { type: boolean, default: true }
      responses:
        '200':
          description: Updated
        '404':
          description: Not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/captures/{capture_id}/delete:
    post:
      tags: [Backups]
      summary: >-
        Remove a version's files and its index entry, always together. The library is
        not touched
      description: >-
        There is no record-only option. The index is derived from the backup tree, so
        removing a row on its own frees no space and the entry returns at the next
        rebuild. Any `delete_files` or `delete_record` flag in the body is ignored.
      parameters:
        - name: capture_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
        '400':
          description: Not found, or the files could not be removed
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/delete/preview:
    post:
      tags: [Backups]
      summary: Preview a deletion — what it removes and the space it frees. Reads only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of capture_ids or slot_keys is required.
              properties:
                capture_ids: { type: array, items: { type: string } }
                slot_keys: { type: array, items: { type: string } }
                keep_newest:
                  type: integer
                  description: With slot_keys, leave the most recent N of each.
                include_pinned: { type: boolean, default: false }
      responses:
        '200':
          description: Candidates, count, total size and how many pins were held back
        '400':
          description: Nothing was selected
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/delete:
    post:
      tags: [Backups]
      summary: Remove several versions at once — the space-reclaiming action
      description: >-
        Pinned versions are held back unless include_pinned is set, and the
        number held back is reported. Removes the files and the index entry
        together, prunes the folders it emptied, and never touches the library.
        This has no undo — those files are the last copy of that version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                capture_ids: { type: array, items: { type: string } }
                slot_keys: { type: array, items: { type: string } }
                keep_newest: { type: integer }
                include_pinned: { type: boolean, default: false }
      responses:
        '200':
          description: What was deleted and how much was reclaimed
        '400':
          description: Nothing was selected
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/unsorted/delete:
    post:
      tags: [Backups]
      summary: Throw away everything that could not be identified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean }
      responses:
        '200':
          description: What was removed
        '400':
          description: Not confirmed
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/rebuild:
    post:
      tags: [Backups]
      summary: Regenerate the index by walking the backup tree
      description: >-
        The tree is the source of truth; this index is a view over it. Writes no
        files and deletes no media, and is idempotent. Pins, displacement reasons
        and transfer provenance are carried forward, because a path cannot hold
        them.
      responses:
        '200':
          description: Counts of what was indexed and what stale entries went
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/retention:
    get:
      tags: [Backups]
      summary: The retention rule and backup-disk usage
      responses:
        '200':
          description: >-
            Rule and disk usage. `retention.editable` is false when there is no
            database store, in which case the rule is env-file only.
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Backups]
      summary: Save the retention rule
      description: >-
        Written to the app_settings table, not the env file — the only store
        that both survives a restart and is visible to the background thread
        that applies the rule after a transfer.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keep: { type: integer, minimum: 1, maximum: 50 }
                grace_hours: { type: integer, minimum: 0 }
                enabled: { type: boolean }
      responses:
        '200':
          description: The saved rule
        '400':
          description: Invalid value, or no settings store is available
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/retention/preview:
    post:
      tags: [Backups]
      summary: Which versions keep-N would remove. Reads only
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keep: { type: integer }
                grace_hours: { type: integer }
      responses:
        '200':
          description: Candidates and the space they hold
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/retention/apply:
    post:
      tags: [Backups]
      summary: Remove them, reporting what went and how much was reclaimed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keep: { type: integer }
                grace_hours: { type: integer }
      responses:
        '200':
          description: What was deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/migration/plan:
    post:
      tags: [Backups]
      summary: Preview adopting the old per-transfer folders. Moves nothing
      responses:
        '200':
          description: >-
            Planned moves, unidentified files and empty folders. `blocked` is set
            when a transfer is still running, because migration moves files
            across the whole backup disk.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/migration/apply:
    post:
      tags: [Backups]
      summary: Carry out the migration and rebuild the index over the result
      description: >-
        Re-walks the disk and derives its own plan rather than redeeming the one
        `/migration/plan` returned, so a folder that appeared or changed since
        the preview is handled as it is now. Safe here in a way it would not be
        for a deletion: migration only moves legacy folders into the tree and
        removes ones it has emptied, so a drifted plan costs accuracy, not files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean }
      responses:
        '200':
          description: What moved and what was removed
        '400':
          description: Not confirmed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            Refused. A transfer is active, or whether one is active could not be
            determined. The body carries `applied: false` and the reason in
            `message`.

  # ---- Deprecated backup compatibility endpoints -------------------------
  # Retained for one React cutover soak. Backed by the same store, with a
  # capture id in place of the old backup id.

  /backups:
    get:
      tags: [Backups]
      summary: (Legacy) Versions newest first, in the old record shape
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Backup list
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/{backup_id}:
    get:
      tags: [Backups]
      summary: (Legacy) One version in the old record shape
      parameters:
        - name: backup_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Backup record
        '404':
          description: Not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/{backup_id}/files:
    get:
      tags: [Backups]
      summary: (Legacy) The files inside one version
      parameters:
        - name: backup_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Files
        '404':
          description: Not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/{backup_id}/plan:
    post:
      tags: [Backups]
      summary: (Legacy) Restore preview in the old plan shape
      description: >-
        Here an empty `files` list means EVERYTHING, which is what the old page
        sends. The current API rejects it instead.
      parameters:
        - name: backup_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string }
                  description: >-
                    Relative paths inside the capture. Omitted, null or empty
                    all mean every file — the current API rejects an empty list
                    instead.
      responses:
        '200':
          description: Plan
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/{backup_id}/restore:
    post:
      tags: [Backups]
      summary: (Legacy) Start a restore
      parameters:
        - name: backup_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Accepted
        '400':
          description: Blocked or refused
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/{backup_id}/delete:
    post:
      tags: [Backups]
      summary: (Legacy) Remove a version. Files and entry go together
      parameters:
        - name: backup_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
        '400':
          description: Not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/reindex:
    post:
      tags: [Backups]
      summary: (Legacy) The index rebuild under its old name
      responses:
        '200':
          description: Import summary
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== DEBUG AND DIAGNOSTICS ====================

  /runtime/status:
    get:
      tags: [Debug]
      summary: Return the lightweight connectivity state the frontend shell polls
      responses:
        '200':
          description: Runtime status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  runtime_status:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /debug:
    get:
      tags: [Debug]
      summary: Return a wide diagnostic snapshot of config, SSH, websocket and transfer state
      responses:
        '200':
          description: Diagnostic snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  debug_info:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /debug/transfers:
    get:
      tags: [Debug]
      summary: Return database-focused transfer diagnostics
      responses:
        '200':
          description: Transfer diagnostics
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  debug_info:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /websocket/status:
    get:
      tags: [Debug]
      summary: Report the websocket connection count and per-connection timing
      responses:
        '200':
          description: Websocket status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  websocket_status:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /local-files:
    get:
      tags: [Debug]
      summary: List the files in a local directory
      parameters:
        - name: path
          in: query
          required: false
          schema:
            type: string
            default: "/"
      responses:
        '200':
          description: File names
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  files:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /disk-usage/local:
    get:
      tags: [Debug]
      summary: Return disk usage for the configured local paths
      responses:
        '200':
          description: Per-path usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  disk_info:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /disk-usage/remote:
    get:
      tags: [Debug]
      summary: Call the configured remote disk API and normalise its storage figures
      responses:
        '200':
          description: Remote storage figures
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  storage_info:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== SERVER LOGS ====================

  /logs:
    get:
      tags: [Logs]
      summary: Return recent backend log records matching the requested severity
      description: >-
        Matching is not uniformly "level and above". ALL returns everything,
        ERROR returns ERROR and CRITICAL, WARNING returns WARNING, ERROR and
        CRITICAL, and DEBUG, INFO and CRITICAL match that level exactly. An
        unrecognised value is coerced to ERROR.
      parameters:
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL, ALL]
            default: ERROR
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            maximum: 1000
        - name: search
          in: query
          required: false
          description: Case-insensitive substring match.
          schema:
            type: string
      responses:
        '200':
          description: Log records
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  log_file:
                    type: string
                  level:
                    type: string
                  limit:
                    type: integer
                  line_count:
                    type: integer
                  size_bytes:
                    type: integer
                  last_modified:
                    type: string
                    format: date-time
                  lines:
                    type: array
                    description: Oldest first.
                    items:
                      type: object
                      properties:
                        level:
                          type: string
                        text:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /logs/download:
    get:
      tags: [Logs]
      summary: Download the whole backend log file as an attachment
      responses:
        '200':
          description: The live log file as an attachment. Rotated files are not served.
          content:
            text/plain:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Log file is not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== SIMULATION ====================

  /simulation/status:
    get:
      tags: [Simulation]
      summary: List the available scenarios and what is currently on the board
      responses:
        '200':
          description: Scenarios and current simulation state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  scenarios:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: integer
                  by_status:
                    type: object
                    additionalProperties: true
                  finished:
                    type: boolean
                  disk_bytes:
                    type: integer
                  real_transfers_running:
                    type: integer
                  max_concurrent:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /simulation/start:
    post:
      tags: [Simulation]
      summary: Generate fixture files and run a scenario through the real transfer pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario:
                  type: string
                  enum: [queue_overflow, path_conflict, slow_copy, failure, season_batch]
                confirm_busy:
                  type: boolean
                  description: Required to proceed when real transfers are running.
              required: [scenario]
      responses:
        '200':
          description: Simulation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  run_id:
                    type: string
                  transfer_ids:
                    type: array
                    items:
                      type: string
        '400':
          description: Unknown scenario, a simulation already on the board, a scenario above the size ceiling, or too little free disk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Real transfers are running and confirm_busy was not set
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  code:
                    type: string
                    enum: [real_transfers_running]
                  message:
                    type: string
                  running:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /simulation/stop:
    post:
      tags: [Simulation]
      summary: Cancel simulated transfers that are still moving, leaving their rows in place
      responses:
        '200':
          description: Stop summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  stopped:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /simulation/cleanup:
    post:
      tags: [Simulation]
      summary: Remove every simulation row and the files the simulation generated
      responses:
        '200':
          description: Cleanup summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  transfers_removed:
                    type: integer
                  notifications_removed:
                    type: integer
                  files_removed:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /explore/libraries:
    get:
      tags: [Explore]
      summary: The three libraries, their configured paths and when each was last compared
      responses:
        '200':
          description: Library list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  libraries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, enum: [movies, tvshows, anime] }
                        label: { type: string }
                        remote_path: { type: string }
                        local_path: { type: string }
                        configured: { type: boolean }
                        local_exists: { type: boolean }
                        checked_at: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /explore/tree/{media_type}:
    get:
      tags: [Explore]
      summary: Every series in one library with rolled-up status and its seasons
      parameters:
        - name: media_type
          in: path
          required: true
          schema: { type: string, enum: [movies, tvshows, anime] }
        - name: refresh
          in: query
          required: false
          description: "1 forces a fresh comparison; rate limited"
          schema: { type: string }
      responses:
        '200':
          description: Series list, with `stale` true when served from cache
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: No remote browse session
        '429':
          description: Rate limited (12 comparisons per minute per user)

  /explore/series/{media_type}/{folder}:
    get:
      tags: [Explore]
      summary: One series with its seasons, from a fresh comparison
      parameters:
        - name: media_type
          in: path
          required: true
          schema: { type: string }
        - name: folder
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Series with seasons
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown library or series
        '429':
          description: Rate limited

  /explore/season/{media_type}/{folder}/{season}:
    get:
      tags: [Explore]
      summary: One season's episodes, each labelled IN_SYNC / MISSING / UPGRADED / LOCAL_ONLY
      parameters:
        - name: media_type
          in: path
          required: true
          schema: { type: string }
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - name: season
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Season with episodes
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown library, series or season
        '429':
          description: Rate limited

  /explore/history/{media_type}/{folder}:
    get:
      tags: [Explore]
      summary: Past Explore runs for this series, with per-file records
      parameters:
        - name: media_type
          in: path
          required: true
          schema: { type: string }
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - name: season
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Runs, newest first
        '401':
          $ref: '#/components/responses/Unauthorized'

  /explore/backups/{media_type}/{folder}:
    get:
      tags: [Explore]
      summary: Copies an earlier sync moved aside for this series or season; backup_id is the capture id used by the /backups restore endpoints
      parameters:
        - name: media_type
          in: path
          required: true
          schema: { type: string }
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - name: season
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: "Backup runs; shown_count/shown_size describe what survives the season filter"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /explore/repair/{media_type}/{folder}:
    get:
      tags: [Explore]
      summary: What repairing the misplaced files here would do; moves nothing
      description: >-
        Local only. Works with the browse session down, because a repair never
        asks the remote anything. `blocked` names what will not be touched and
        why; `blocker` is set when the repair cannot run at all right now.
      parameters:
        - name: media_type
          in: path
          required: true
          schema: { type: string }
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - name: season
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: >-
            Repair plan. Each action carries a `rival` (and `needs_decision`)
            when another copy of the same episode or film is already in place,
            found by identity rather than filename.
        '400':
          description: Invalid folder or season name
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown library
    post:
      tags: [Explore]
      summary: Move the misplaced files back into place
      description: >-
        The plan is rebuilt server-side from the disk as it is now, so the body
        cannot name a file to move. Nothing is renamed and nothing is
        overwritten.
      parameters:
        - name: media_type
          in: path
          required: true
          schema: { type: string }
        - name: folder
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                season: { type: string, nullable: true }
                decisions:
                  type: object
                  description: >-
                    For contested files only, keyed by the stranded file's
                    relative path. `keep_existing` deletes the stranded copy;
                    `replace` removes the copy in place and promotes the
                    stranded one. A contested file with no decision is left
                    alone and reported in `failed`. The losing copy is captured
                    into the backup area first, so either answer is reversible.
                    `rival` must be the copy the preview showed; if the disk no
                    longer agrees, the decision is refused rather than applied
                    to a file nobody looked at.
                  additionalProperties:
                    type: object
                    required: [choice, rival]
                    properties:
                      choice:
                        type: string
                        enum: [keep_existing, replace]
                      rival: { type: string }
      responses:
        '200':
          description: "moved / deleted / replaced / failed, with counts, freed bytes and folders removed"
        '400':
          description: Nothing in scope can be repaired automatically
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A transfer is active against this title, or that could not be checked

  /explore/plan:
    post:
      tags: [Explore]
      summary: Evaluate an operation and store it for approval; writes nothing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_type, operation, folder]
              properties:
                media_type: { type: string, enum: [movies, tvshows, anime] }
                operation:
                  type: string
                  enum: [sync_series, sync_seasons, sync_season, download, replace]
                folder: { type: string }
                season: { type: string, nullable: true }
                seasons:
                  type: array
                  items: { type: string }
                codes:
                  type: array
                  items: { type: string }
                include_removals: { type: boolean, default: true }
      responses:
        '200':
          description: The plan, its verdict, safety checks and plan_id
        '400':
          description: Unknown operation or invalid folder name
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown library, series or season
        '409':
          description: No remote browse session
        '429':
          description: Rate limited
        '502':
          description: The remote listing failed

  /explore/dry-run:
    post:
      tags: [Explore]
      summary: Rehearse a plan with rsync --dry-run; leaves the plan runnable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: string }
      responses:
        '200':
          description: "What rsync says, reconciled against the plan"
        '400':
          description: plan_id missing
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The plan expired or was already used
        '429':
          description: Rate limited
        '503':
          description: Dry run unavailable on this server

  /explore/transfer:
    post:
      tags: [Explore]
      summary: Execute a stored plan; consumes it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: string }
                override:
                  type: boolean
                  description: Required when the plan failed its safety checks
                confirm_text:
                  type: string
                  description: Must equal the season label, or the series name when there is none
      responses:
        '200':
          description: "Started or queued; transfer_id is null for a removals-only plan"
        '400':
          description: plan_id missing
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The plan expired or was already used
        '422':
          description: Failed its checks and needs an override plus the typed confirmation
        '500':
          description: The run could not be started; any moved files were rolled back

  /webhook/series/notifications/sync-batch:
    post:
      tags: [Webhooks - Management]
      summary: Sync a group of series/anime notifications as one transfer per season
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notification_ids]
              properties:
                notification_ids:
                  type: array
                  items: { type: integer }
      responses:
        '200':
          description: One entry per season started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
                  transfers:
                    type: array
                    items:
                      type: object
                      properties:
                        season: { type: integer, nullable: true }
                        notification_id: { type: integer }
                        transfer_id: { type: string, nullable: true }
        '400':
          description: Empty or non-list notification_ids
        '401':
          $ref: '#/components/responses/Unauthorized'
